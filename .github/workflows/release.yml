name: Build and publish Zenko

# Push a tag like v2026.11.22-zenko16 (the APP_VERSION in zenko.py) and this builds Zenko.exe on Windows
# and publishes a GitHub Release with Zenko.exe + zenko.py (and their SHA-256 files). Zenko updates itself from it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(grep -m1 -oP '^APP_VERSION = "\K[^"]+' zenko.py)
          echo "zenko.py says $V, tag is ${GITHUB_REF_NAME}"
          test "$V" = "${GITHUB_REF_NAME}"
      - name: Build Zenko.exe
        shell: cmd
        run: |
          python zenko.py --make-icon zenko.ico
          python -m pip install --upgrade pyinstaller rmscene pypdf ddgs
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Zenko --icon zenko.ico --add-data "zenko.ico;." --collect-submodules rmscene --collect-submodules pypdf --hidden-import ddgs --collect-submodules ddgs.engines --collect-submodules primp zenko.py
      - name: Checksums
        shell: bash
        run: |
          mkdir out
          cp dist/Zenko.exe out/Zenko.exe
          cp zenko.py out/zenko.py
          cd out
          sha256sum Zenko.exe | cut -d' ' -f1 > Zenko.exe.sha256
          sha256sum zenko.py | cut -d' ' -f1 > zenko.py.sha256
          ls -la
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk '/^## /{if(p)exit} /^## '"${GITHUB_REF_NAME}"'/{p=1;next} p' CHANGES.md || true)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # you made the release on github.com: just attach the freshly built files to it
            gh release upload "${GITHUB_REF_NAME}" out/Zenko.exe out/zenko.py out/Zenko.exe.sha256 out/zenko.py.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" out/Zenko.exe out/zenko.py out/Zenko.exe.sha256 out/zenko.py.sha256 \
              --title "Zenko ${GITHUB_REF_NAME#v}" --notes "${NOTES:-Zenko ${GITHUB_REF_NAME}}" --latest
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: zenko-build
          path: out/
