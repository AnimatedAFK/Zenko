name: Build Zenko Browser

# Builds ZenkoBrowser.exe on Windows whenever browser/ changes (download it from the run's Artifacts),
# and attaches it to the GitHub Release when you publish one with a tag like browser-v0.1.0.
# Browser releases are pre-releases, so Zenko's own updater (which reads the "latest" release) never sees them.
on:
  push:
    branches: ["**"]
    paths: ["browser/**", ".github/workflows/browser.yml"]
    tags: ["browser-v*"]
  pull_request:
    paths: ["browser/**", ".github/workflows/browser.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)
          echo "Cargo.toml says $V, tag is ${GITHUB_REF_NAME}"
          test "browser-v$V" = "${GITHUB_REF_NAME}"
      - name: Test
        run: cargo test --release
      - name: Build ZenkoBrowser.exe
        run: cargo build --release
      - name: Checksum
        shell: bash
        run: |
          mkdir -p out
          cp target/release/ZenkoBrowser.exe out/ZenkoBrowser.exe
          cd out
          sha256sum ZenkoBrowser.exe | cut -d' ' -f1 > ZenkoBrowser.exe.sha256
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ZenkoBrowser
          path: browser/out/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/browser-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${GITHUB_REF_NAME}"
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" out/ZenkoBrowser.exe out/ZenkoBrowser.exe.sha256 --clobber
            gh release edit "$T" --prerelease
          else
            gh release create "$T" out/ZenkoBrowser.exe out/ZenkoBrowser.exe.sha256 --prerelease \
              --title "Zenko Browser ${T#browser-v}" --notes "Zenko Browser ${T#browser-v}"
          fi
