<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus mode</title>
<link rel="stylesheet" href="theme.css">
<script src="prefs.js"></script>
<style>
  body { overflow: hidden; min-height: 100vh; background: var(--night); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  /* the site fades out behind a pair of shoji screens that slide shut */
  #ghost { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; color: var(--grey); font-size: 3.2rem; font-weight: 700; letter-spacing: .04em;
    opacity: .5; filter: blur(0); transition: opacity 1.4s ease, filter 1.4s ease; }
  .shut #ghost { opacity: 0; filter: blur(8px); }
  .shoji { position: fixed; top: 0; bottom: 0; width: 50.5%; z-index: 2; transition: transform 1.15s cubic-bezier(.65,.02,.25,1);
    background:
      linear-gradient(90deg, transparent calc(100% - 10px), #3a2416 calc(100% - 10px)),
      repeating-linear-gradient(90deg, transparent 0 calc(25% - 3px), #5b3a22 calc(25% - 3px) 25%),
      repeating-linear-gradient(180deg, transparent 0 calc(12.5vh - 3px), #5b3a22 calc(12.5vh - 3px) 12.5vh),
      radial-gradient(ellipse at 50% 55%, #f6e7c8 0%, #e7d2ab 55%, #cdb185 100%);
    box-shadow: inset 0 0 0 10px #4a2e1b, inset 0 0 60px rgba(90,50,20,.35); }
  .shoji::after { content: ""; position: absolute; inset: 10px; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120,90,50,.05) 0 2px, transparent 2px 5px); }
  .shoji .pull { position: absolute; top: 50%; width: 10px; height: 46px; margin-top: -23px; background: #2a1a10; box-shadow: inset 0 0 0 2px #7a5230; }
  #L { left: 0; transform: translateX(-101%); }
  #L .pull { right: 22px; }
  #R { right: 0; transform: translateX(101%); background-position: 0 0; }
  #R .pull { left: 22px; }
  .shut #L, .shut #R { transform: none; }
  [data-palette="nightshrine"] .shoji, [data-palette="midnight"] .shoji { filter: brightness(.72) saturate(.85); }
  /* lantern light behind the paper */
  #glow { position: fixed; left: 50%; top: 52%; width: 70vmin; height: 70vmin; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
    background: radial-gradient(circle, rgba(255,190,110,.32), rgba(255,170,90,0) 62%); opacity: 0; transition: opacity 1.6s ease .9s; animation: flick 4s ease-in-out infinite; }
  .shut #glow { opacity: 1; }
  @keyframes flick { 50% { filter: brightness(1.12); } 70% { filter: brightness(.94); } }
  /* the fox's silhouette on the paper, like a shadow puppet */
  #shadow { position: fixed; left: 50%; bottom: 13vh; width: 120px; margin-left: -60px; z-index: 3; opacity: 0; transition: opacity 1.2s ease 1.3s; image-rendering: pixelated;
    filter: brightness(0) opacity(.32) blur(1px); animation: sway 5s ease-in-out infinite; }
  .shut #shadow { opacity: 1; }
  @keyframes sway { 50% { transform: translateX(10px) rotate(1deg); } }
  main { position: relative; z-index: 4; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem;
    opacity: 0; transform: translateY(-14px); transition: opacity .7s ease 1.05s, transform .9s cubic-bezier(.2,.9,.25,1.2) 1.05s; }
  .shut main { opacity: 1; transform: none; }
  /* a hanging wooden ema for the message */
  .ema { position: relative; max-width: 31rem; margin-top: 2.2rem; padding: 1.5rem 1.9rem 1.3rem; color: #3a2414;
    background: linear-gradient(180deg, #d9a96a, #c48d4f); clip-path: polygon(50% 0, 100% 16%, 100% 100%, 0 100%, 0 16%);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); animation: hang 6s ease-in-out infinite; transform-origin: 50% -2.2rem; }
  .ema::before { content: ""; position: absolute; inset: 7px; clip-path: polygon(50% 0, 100% 16%, 100% 100%, 0 100%, 0 16%);
    background: repeating-linear-gradient(92deg, rgba(110,60,20,.08) 0 3px, transparent 3px 11px), linear-gradient(180deg, #ecc58e, #d9a96a); z-index: -1; }
  .ema { isolation: isolate; }
  .cord { position: absolute; left: 50%; top: -2.2rem; width: 2px; height: 2.6rem; background: #b5362a; margin-left: -1px; z-index: 5; }
  @keyframes hang { 50% { transform: rotate(1.2deg); } }
  .jp { color: #b5362a; letter-spacing: .3em; font-size: 1.5rem; font-weight: 700; margin: .4rem 0 .2rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.45rem; font-weight: 700; }
  p { color: #5a3a22; line-height: 1.55; margin: .3rem 0 1rem; }
  .host { color: #2a1a10; font-weight: 700; }
  #ses { display: none; margin: -.4rem 0 1rem; padding: .35rem .7rem; font-size: .95rem; color: #fff3df; background: #8f2a1a; clip-path: var(--clips); }
  .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .ema .obtn { background: #f4dcb2; color: #3a2414; box-shadow: inset 0 0 0 2px #8f5a2c, inset 0 -4px 0 rgba(0,0,0,.12); }
  .ema .obtn:hover { background: #fff0d2; box-shadow: inset 0 0 0 2px #b5362a, inset 0 -4px 0 rgba(0,0,0,.12); }
  .ema .obtn.solid { background: #b5362a; color: #fff3df; }
  [data-motion="reduced"] * { transition-duration: .01s !important; animation: none !important; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="ghost"></div>
<div class="shoji" id="L"><i class="pull"></i></div><div class="shoji" id="R"><i class="pull"></i></div>
<div id="glow"></div>
<img id="shadow" src="zenko.png" alt="">
<main>
  <div class="ema">
    <span class="cord"></span>
    <div class="jp">集中</div>
    <h1>Focus mode is on</h1>
    <p><span class="host" id="host">This site</span> is resting behind the shoji while you focus. You can do it, just a little longer~</p>
    <div id="ses"></div>
    <div class="row">
      <button class="obtn solid" id="back">Back to studying</button>
      <button class="obtn" id="five">Let me in for 5 minutes</button>
      <button class="obtn" id="off">Turn focus mode off</button>
    </div>
  </div>
</main>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const send = (o) => window.ipc && window.ipc.postMessage(JSON.stringify(o));
  const p = ZB.load();
  ZB.apply(p);
  ZB.sky($("#sky"), { moon: [0.8, 0.16, 11], ridge: 0.3, torii: 0.5, wisps: 6 });
  const u = new URLSearchParams(location.search).get("u") || "";
  let host = "";
  try { host = new URL(u).hostname.replace(/^www\./, ""); } catch (e) {}
  if (host) { $("#host").textContent = host; $("#ghost").textContent = host; }
  requestAnimationFrame(() => setTimeout(() => document.body.classList.add("shut"), 60));
  // Zenko's study session, if one is running (from Zenko's link file)
  window.zbNT = (d) => {
    const s = d && d.linked && d.zcal && d.zcal.session;
    if (!s || !s.on) return;
    const left = s.until ? Math.max(0, Math.round((s.until * 1000 - Date.now()) / 60000)) : 0;
    const e = $("#ses");
    e.textContent = (s.kind === "lockin" ? "Lock-in with Zenko" : "Studying with Zenko") + (s.task ? ": " + s.task : "") + (left ? " · " + left + " min left" : "");
    e.style.display = "inline-block";
  };
  send({ c: "ntData" });
  setInterval(() => send({ c: "ntData" }), 30000);
  $("#back").onclick = () => { if (history.length > 1) history.back(); else location.href = "http://zenko.localhost/newtab"; };
  $("#five").onclick = () => {
    document.body.classList.remove("shut");
    setTimeout(() => send({ c: "focusPause", min: 5, url: u }), 700);
  };
  $("#off").onclick = () => {
    const q = ZB.load(); q.focus = false; q.focusAuto = ""; ZB.save(q);
    document.body.classList.remove("shut");
    setTimeout(() => { if (u) location.href = u; }, 900);
  };
})();
</script>
</body>
</html>
