<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus mode</title>
<link rel="stylesheet" href="theme.css">
<script src="prefs.js"></script>
<style>
  body { overflow: hidden; min-height: 100vh; background: var(--night); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  main { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem; }
  img { width: 150px; image-rendering: pixelated; filter: drop-shadow(0 0 20px color-mix(in srgb, var(--glow) 40%, transparent)); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .card { max-width: 32rem; margin-top: 1rem; padding: 1.4rem 1.8rem; }
  h1 { margin: 0 0 .4rem; font-size: 1.6rem; font-weight: 600; }
  .jp { color: var(--gold); letter-spacing: .2em; margin-bottom: .6rem; }
  p { color: var(--grey); line-height: 1.55; margin: .3rem 0 1rem; }
  .host { color: var(--ink); font-weight: 700; }
  .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <img src="zenko.png" alt="Zenko">
  <div class="card pxb">
    <div class="jp">集中</div>
    <h1>Focus mode is on</h1>
    <p><span class="host" id="host">This site</span> is blocked while you focus. You can do it, just a little longer~</p>
    <div class="row">
      <button class="obtn solid" id="back">Back to studying</button>
      <button class="obtn" id="five">Let me in for 5 minutes</button>
      <button class="obtn" id="off">Turn focus mode off</button>
    </div>
  </div>
</main>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const send = (o) => window.ipc && window.ipc.postMessage(JSON.stringify(o));
  const p = ZB.load();
  ZB.apply(p);
  ZB.sky($("#sky"), { moon: [0.8, 0.16, 11], ridge: 0.3, torii: 0.5, wisps: 6 });
  const u = new URLSearchParams(location.search).get("u") || "";
  try { $("#host").textContent = new URL(u).hostname.replace(/^www\./, ""); } catch (e) {}
  $("#back").onclick = () => { if (history.length > 1) history.back(); else location.href = "http://zenko.localhost/newtab"; };
  $("#five").onclick = () => send({ c: "focusPause", min: 5, url: u });
  $("#off").onclick = () => { const q = ZB.load(); q.focus = false; ZB.save(q); setTimeout(() => { if (u) location.href = u; }, 300); };
})();
</script>
</body>
</html>
