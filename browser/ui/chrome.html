<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zenko Browser</title>
<link rel="stylesheet" href="theme.css">
<script src="prefs.js"></script>
<style>
  body { user-select: none; background: var(--night); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  #app { position: fixed; inset: 0; display: flex; z-index: 1; }

  /* ---------- side tabs column */
  #sidecol { display: none; width: 15.5rem; flex: none; flex-direction: column; padding: .5rem 0 .6rem .55rem; gap: .35rem; }
  [data-tabs="side"] #sidecol { display: flex; }
  #sidetop { display: flex; align-items: center; height: 2.4rem; }
  #col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { height: 3rem; display: flex; align-items: flex-end; padding: 0 0 0 .5rem; gap: .25rem; flex: none; position: relative; }
  [data-tabs="side"] #bar { display: none; }
  .brand { display: flex; align-items: center; gap: .45rem; height: 2.4rem; padding: 0 .55rem 0 .25rem; flex: none; align-self: center; cursor: default; }
  .brand .mask { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--glow) 55%, transparent)); animation: bob 4s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-1px); } }
  .brand b { font-family: "DotGothic16", var(--font); font-weight: 400; font-size: 1.05rem; letter-spacing: .28em; color: var(--gold); text-shadow: 0 0 10px color-mix(in srgb, var(--gold) 40%, transparent), 2px 2px 0 rgba(0,0,0,.35); }
  [data-tabs="top"] .brand b { display: none; }
  .grow { flex: 1; align-self: stretch; }
  .winbtns { display: flex; align-self: flex-start; flex: none; position: relative; z-index: 3; }
  .winbtns button { width: 3.2rem; height: 2.3rem; display: grid; place-items: center; color: var(--grey); transition: background .12s, color .12s; }
  .winbtns button:hover { background: color-mix(in srgb, var(--hover) 80%, transparent); color: var(--ink); }
  .winbtns button.x:hover { background: #c42b3c; color: #fff; }
  #tools .winbtns { display: none; margin: 0 -.6rem 0 .35rem; }
  [data-tabs="side"] #tools .winbtns { display: flex; }

  /* ---------- tabs */
  #tabs { position: relative; display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; height: 100%; padding-top: .45rem; }
  [data-tabs="side"] #tabs { flex-direction: column; align-items: stretch; overflow-y: auto; overflow-x: hidden; height: auto; flex: 0 1 auto; padding: .1rem .3rem .2rem 0; gap: 3px; }
  .tab {
    position: relative; flex: 1 1 14rem; max-width: 15rem; min-width: 2.8rem; height: 2.45rem; display: flex; align-items: center; gap: .55rem;
    padding: 0 .4rem 0 .75rem; color: color-mix(in srgb, var(--ink) 72%, var(--grey)); cursor: default; clip-path: var(--cliptop);
    transition: background .16s, color .16s, max-width .24s cubic-bezier(.2,.8,.2,1), opacity .2s, transform .2s steps(3);
    animation: tabIn .32s cubic-bezier(.2,.9,.25,1.25);
  }
  [data-density="compact"] .tab { height: 2.15rem; }
  .tab:hover { background: color-mix(in srgb, var(--panel) 55%, transparent); color: var(--ink); }
  .tab.active { background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--gold), inset 2px 0 0 color-mix(in srgb, var(--gold) 35%, transparent), inset -2px 0 0 color-mix(in srgb, var(--gold) 35%, transparent); }
  .tab.active::after { content: ""; position: absolute; left: 6px; right: 6px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #fff8, transparent); background-size: 40% 100%; background-repeat: no-repeat;
    animation: shimmer 3.2s steps(24) infinite; }
  @keyframes shimmer { from { background-position: -60% 0; } to { background-position: 160% 0; } }
  .tab.leave { max-width: 0 !important; min-width: 0; opacity: 0; padding: 0; pointer-events: none; }
  .tab.drag { opacity: .45; }
  .tab.over::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  @keyframes tabIn { from { max-width: 0; opacity: 0; transform: translateY(10px); } }
  [data-shape="round"] .tab { clip-path: none; border-radius: var(--r) var(--r) 0 0; }
  [data-shape="pill"] .tab { clip-path: var(--clips); height: 2.05rem; margin-bottom: .3rem; }
  [data-shape="pill"] .tab.active { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent); }
  [data-shape="square"] .tab { clip-path: none; }
  [data-tabs="side"] .tab { flex: none; max-width: none; height: 2.3rem; clip-path: var(--clips); animation-name: tabInSide; margin: 0; }
  [data-tabs="side"] .tab.active { box-shadow: inset 2px 0 0 var(--gold), inset 0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); }
  [data-tabs="side"] .tab.leave { max-height: 0; height: 0; }
  [data-tabs="side"] .tab.over::before { left: 10%; right: 10%; top: 0; bottom: auto; width: auto; height: 2px; }
  @keyframes tabInSide { from { opacity: 0; transform: translateX(-12px); height: 0; } }
  .tab .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--accbg); color: var(--acc); overflow: hidden; clip-path: var(--clips); }
  .tab .ic img { width: 16px; height: 16px; }
  .tab.active .ic { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 60%, transparent)); }
  .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); font-size: 1rem; }
  .tab.asleep .t, .tab.asleep .ic { opacity: .45; }
  .tab .aud { color: var(--gold); display: none; padding: 2px; }
  .tab .aud svg { animation: blip 1s steps(2) infinite; }
  .tab.muted .aud svg { animation: none; }
  @keyframes blip { 50% { transform: translateY(-1px); } }
  .tab .aud:hover { background: var(--hover); }
  .tab.audio .aud, .tab.muted .aud { display: block; }
  .tab .x { width: 1.5rem; height: 1.5rem; display: grid; place-items: center; color: var(--grey); opacity: 0; transition: opacity .12s, background .12s; flex: none; clip-path: var(--clips); }
  .tab:hover .x, [data-tabs="top"] .tab.active .x { opacity: 1; }
  .tab .x:hover { background: color-mix(in srgb, #c42b3c 70%, transparent); color: #fff; }
  .tab.loading .ic { animation: flick .9s steps(3) infinite; }
  @keyframes flick { 50% { filter: drop-shadow(0 0 5px var(--glow)) brightness(1.4); transform: scale(.85); } }
  #ind { display: none; }
  #newtab { flex: none; align-self: center; margin-bottom: .1rem; }
  [data-tabs="side"] #newtab { align-self: stretch; justify-content: flex-start; padding-left: .75rem; margin: .15rem .3rem 0 0; height: 2.3rem; gap: .6rem; }
  #newtab span { display: none; }
  [data-tabs="side"] #newtab span { display: inline; }

  /* pixel sparkles (tab open / close) */
  .spark { position: fixed; width: 3px; height: 3px; background: var(--gold); pointer-events: none; z-index: 80; box-shadow: 0 0 4px var(--gold); animation: spark .5s steps(6) forwards; }
  .spark.g { background: var(--glow); box-shadow: 0 0 4px var(--glow); }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

  /* ---------- toolbar */
  #tools { height: 3.15rem; display: flex; align-items: center; gap: .15rem; padding: 0 .55rem; flex: none; position: relative;
    background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), color-mix(in srgb, var(--panel) 80%, transparent)); }
  #tools canvas.waves { position: absolute; right: 0; top: 0; height: 100%; width: 42%; opacity: .45; z-index: 0; image-rendering: pixelated; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 75%); }
  .lantern { width: 18px; flex: none; align-self: flex-start; margin: 0 .2rem 0 .1rem; position: relative; height: 2.7rem; }
  .lantern::before { content: ""; position: absolute; left: 6px; top: 0; width: 2px; height: 1rem; background: color-mix(in srgb, var(--gold) 60%, transparent); }
  .lantern i { position: absolute; left: -2px; top: 1rem; width: 18px; height: 20px; background: #d9472b; clip-path: var(--clips);
    box-shadow: inset 0 3px 0 #8f2a1a, inset 0 -3px 0 #8f2a1a; animation: sway 3.4s steps(4) infinite alternate; transform-origin: 7px -1rem; }
  .lantern i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 6px; height: 8px; background: #ffd27a; box-shadow: 0 0 10px 4px color-mix(in srgb, #ffb347 55%, transparent); animation: glowp 1.8s steps(3) infinite; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  @keyframes glowp { 50% { opacity: .65; } }
  .corner { position: absolute; width: 12px; height: 12px; z-index: 3; pointer-events: none; }
  .corner::before, .corner::after { content: ""; position: absolute; background: var(--gold); }
  .corner::before { width: 12px; height: 2px; } .corner::after { width: 2px; height: 12px; }
  .corner.tl { left: -4px; top: -4px; } .corner.tr { right: -4px; top: -4px; transform: scaleX(-1); }
  .corner.bl { left: -4px; bottom: -4px; transform: scaleY(-1); } .corner.br { right: -4px; bottom: -4px; transform: scale(-1); }
  .corner i { position: absolute; left: 4px; top: 4px; width: 2px; height: 2px; background: var(--gold); box-shadow: 0 0 4px var(--gold); }

  .glint { position: absolute; width: 10px; height: 2px; background: #fff; box-shadow: 0 0 6px var(--gold); z-index: 3; pointer-events: none; offset-path: inset(0 round 0); opacity: .8;
    animation: orbit 14s linear infinite; }
  @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  #tools::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; pointer-events: none;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--gold) 55%, transparent) 0 4px, transparent 4px 8px); opacity: .55; }
  [data-tabs="side"] #tools { background: color-mix(in srgb, var(--panel) 55%, transparent); margin: .5rem .55rem 0 0; clip-path: var(--clip); }
  [data-tabs="side"] #tools::after { display: none; }
  [data-density="compact"] #tools { height: 2.7rem; }
  #tools > * { position: relative; z-index: 1; }
  .btn { clip-path: var(--clips); border-radius: 0; height: 2.25rem; min-width: 2.25rem; }
  .btn:hover { background: color-mix(in srgb, var(--hover) 90%, transparent); color: var(--ink); }
  .btn:hover svg { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--glow) 70%, transparent)); }
  .btn:active { transform: translateY(1px); }
  .btn.on { color: var(--night); background: var(--acc); }
  .btn.on svg { filter: none; }
  #addr { flex: 1; max-width: 48rem; height: 2.3rem; display: flex; align-items: center; gap: .55rem; padding: 0 .4rem 0 .8rem; margin: 0 .45rem;
    --b: color-mix(in srgb, var(--line) 70%, var(--gold) 30%); --c: color-mix(in srgb, var(--night) 65%, var(--field)); color: var(--grey); cursor: text; min-width: 0; overflow: hidden; }
  #addr:hover { --b: color-mix(in srgb, var(--gold) 80%, var(--line)); }
  #addr::after { content: ""; position: absolute; inset: 2px; background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--gold) 14%, transparent) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 120% 0; pointer-events: none; }
  #addr:hover::after { animation: sweep .9s steps(18) 1; }
  @keyframes sweep { from { background-position: 120% 0; } to { background-position: -20% 0; } }
  #addr .host { color: var(--ink); white-space: nowrap; font-weight: 700; }
  #addr .path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #addr .lock { color: var(--gold); flex: none; }
  kbd { font: inherit; font-size: .8rem; color: var(--grey); padding: .05rem .4rem; flex: none; clip-path: var(--clips); background: color-mix(in srgb, var(--line) 70%, transparent); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
  .spacer { flex: 1; }
  #notice { display: none; height: 2rem; padding: 0 .3rem 0 .85rem; --b: var(--gold); --c: var(--accbg); color: var(--ink); font-size: .95rem; white-space: nowrap; animation: pop .4s steps(5); }
  #notice.on { display: inline-flex; align-items: center; gap: .5rem; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  #b-claude.on { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 2px #fff6; } }

  /* ---------- page + Claude panel */
  #main { flex: 1; display: flex; padding: .55rem; min-height: 0; gap: 0; }
  [data-tabs="side"] #main { padding-left: 0; }
  #fwrap { position: relative; flex: 1; min-width: 0; }
  #frame { position: absolute; inset: 0; --b: color-mix(in srgb, var(--line) 45%, var(--gold) 55%); --c: var(--paper); }
  #frame .wisp { display: none; }
  #fire { position: absolute; left: 4px; right: 4px; top: 0; height: 2px; overflow: visible; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 2; }
  #fire.on { opacity: 1; }
  #fire::before { content: ""; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, var(--glow), #fff);
    animation: fire 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  #fire::after { content: ""; position: absolute; top: -2px; width: 6px; height: 6px; background: #fff; box-shadow: 0 0 0 2px var(--glow), 0 0 12px 3px var(--glow);
    clip-path: polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%); animation: fire2 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes fire { from { transform: translateX(-100%); } to { transform: translateX(333%); } }
  @keyframes fire2 { from { left: 0; } to { left: calc(100% - 6px); } }
  #split { width: .6rem; flex: none; cursor: col-resize; display: none; position: relative; }
  #split::after { content: ""; position: absolute; left: 50%; top: 46%; height: 8%; width: 2px; margin-left: -1px; background: repeating-linear-gradient(180deg, var(--line) 0 4px, transparent 4px 6px); }
  #split:hover::after, #split.drag::after { background: repeating-linear-gradient(180deg, var(--gold) 0 4px, transparent 4px 6px); height: 18%; top: 41%; }
  #panel { display: none; flex-direction: column; flex: none; width: var(--pw, 430px); --b: color-mix(in srgb, var(--line) 45%, var(--gold) 55%); --c: var(--panel); animation: panelIn .3s steps(6); }
  @keyframes panelIn { from { transform: translateX(36px); opacity: 0; } }
  [data-panel="on"] #panel { display: flex; }
  [data-panel="on"] #split { display: block; }
  .phead { height: 2.45rem; display: flex; align-items: center; gap: .1rem; padding: 0 .35rem 0 .85rem; flex: none; position: relative; }
  .phead::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .phead .dia { flex: 1; margin: 0; font-size: 1.02rem; color: var(--ink); }
  .phead .btn { height: 1.9rem; min-width: 1.9rem; padding: 0 .4rem; }
  #parea { flex: 1; position: relative; }

  /* ---------- window edges for resizing */
  .edge { position: fixed; z-index: 90; }
  .edge.n, .edge.s { left: 10px; right: 10px; height: 5px; } .edge.n { top: 0; cursor: ns-resize; } .edge.s { bottom: 0; cursor: ns-resize; }
  .edge.e, .edge.w { top: 10px; bottom: 10px; width: 5px; } .edge.e { right: 0; cursor: ew-resize; } .edge.w { left: 0; cursor: ew-resize; }
  .edge.ne, .edge.nw, .edge.se, .edge.sw { width: 10px; height: 10px; }
  .edge.ne { top: 0; right: 0; cursor: nesw-resize; } .edge.sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .edge.nw { top: 0; left: 0; cursor: nwse-resize; } .edge.se { bottom: 0; right: 0; cursor: nwse-resize; }
  [data-max="on"] .edge { display: none; }

  /* ---------- command bar */
  #ov { position: fixed; inset: 0; z-index: 60; display: none; }
  #ov.open { display: block; }
  #ov .shot { position: absolute; object-fit: fill; }
  #ov .dim { position: absolute; inset: 0; background: color-mix(in srgb, var(--night) 62%, transparent); backdrop-filter: blur(3px); opacity: 0; transition: opacity .18s; }
  #ov.show .dim { opacity: 1; }
  #pal { position: absolute; left: 50%; top: 12vh; width: min(46rem, calc(100vw - 2rem)); transform: translateX(-50%); opacity: 0; --b: color-mix(in srgb, var(--gold) 80%, var(--line)); --c: var(--panel); }
  #ov.show #pal { opacity: 1; animation: unfold .26s steps(6); }
  @keyframes unfold { from { clip-path: inset(46% 0 46% 0); } to { clip-path: inset(0 0 0 0); } }
  #pal .in { display: flex; align-items: center; gap: .75rem; padding: 1rem 1.15rem; color: var(--gold); position: relative; overflow: hidden; }
  #pal .in::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  #pal .in canvas.waves { position: absolute; right: 0; top: 0; height: 100%; width: 45%; opacity: .35; image-rendering: pixelated; -webkit-mask-image: linear-gradient(90deg, transparent, #000 80%); }
  #pal .in > * { position: relative; }
  #q { flex: 1; background: none; border: 0; outline: 0; font-size: 1.35rem; min-width: 0; caret-color: var(--gold); }
  #q::placeholder { color: var(--grey); }
  #res { max-height: min(60vh, 31rem); overflow-y: auto; padding: .4rem; }
  .it { display: flex; align-items: center; gap: .8rem; padding: .55rem .75rem; color: var(--ink); clip-path: var(--clips); }
  .it .ic { width: 1.85rem; height: 1.85rem; display: grid; place-items: center; background: var(--field); color: var(--grey); flex: none; overflow: hidden; font-weight: 700; clip-path: var(--clips); }
  .it .ic img { width: 16px; height: 16px; }
  .it .tx { flex: 1; min-width: 0; }
  .it .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.02rem; }
  .it .sb { color: var(--grey); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .tag { font-size: .85rem; color: var(--grey); }
  .it.sel { background: color-mix(in srgb, var(--accbg) 75%, var(--panel)); box-shadow: inset 2px 0 0 var(--gold); }
  .it.sel .ic { background: var(--acc); color: var(--night); }
  .it.calc .tt { font-size: 1.3rem; color: var(--gold); font-family: "DotGothic16", var(--font); }
  .grp { padding: .6rem .75rem .25rem; font-size: .9rem; color: var(--gold); display: flex; align-items: center; gap: .5rem; font-family: "DotGothic16", var(--font); letter-spacing: .05em; }
  .grp::before { content: ""; width: 4px; height: 4px; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .foot { display: flex; gap: 1rem; padding: .55rem 1rem; color: var(--grey); font-size: .85rem; position: relative; }
  .foot::before { content: ""; position: absolute; left: 2px; right: 2px; top: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .foot span:last-child { margin-left: auto; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <div id="sidecol">
    <div id="sidetop" data-drag><div class="brand"><span class="mask" id="mask2"></span><b>ZENKO</b></div></div>
  </div>
  <div id="col">
    <div id="bar" data-drag>
      <span class="lantern"><i></i></span>
      <div class="brand"><span class="mask" id="mask1"></span><b>ZENKO</b></div>
      <div id="tabs"><div id="ind"></div></div>
      <button class="btn" id="newtab" title="New tab (Ctrl+T)"><span>New tab</span></button>
      <div class="grow" data-drag></div>
      <div class="winbtns"></div>
    </div>
    <div id="tools" data-drag>
      <canvas class="waves" id="waves"></canvas>
      <button class="btn" id="b-back" title="Back (Alt+Left)"></button>
      <button class="btn" id="b-fwd" title="Forward (Alt+Right)"></button>
      <button class="btn" id="b-reload" title="Reload (F5)"></button>
      <div id="addr" class="pxb" title="Search or type an address (Ctrl+L)"></div>
      <span id="notice" class="pxb"></span>
      <div class="spacer" data-drag></div>
      <button class="btn" id="b-claude" title="Claude panel (Ctrl+J)"></button>
      <button class="btn" id="b-side" title="Side or top tabs"></button>
      <button class="btn" id="b-menu" title="Everything (Ctrl+K)"></button>
      <div class="winbtns"></div>
    </div>
    <div id="main">
      <div id="fwrap"><div id="frame" class="pxb"></div><div id="fire"></div><span class="corner tl"><i></i></span><span class="corner tr"><i></i></span><span class="corner bl"><i></i></span><span class="corner br"><i></i></span><span class="glint"></span></div>
      <div id="split"></div>
      <div id="panel" class="pxb">
        <div class="phead" data-drag>
          <span class="dia">Claude</span>
          <button class="btn" id="p-home" title="New chat"></button>
          <button class="btn" id="p-pop" title="Pop out into its own window"></button>
          <button class="btn" id="p-close" title="Close panel (Ctrl+J)"></button>
        </div>
        <div id="parea"></div>
      </div>
    </div>
  </div>
</div>
<div id="ov">
  <img class="shot" id="shot-page" alt=""><img class="shot" id="shot-panel" alt="">
  <div class="dim"></div>
  <div id="pal" class="pxb">
    <div class="in"><canvas class="waves" id="pwaves"></canvas><span id="qi"></span><input id="q" spellcheck="false" autocomplete="off" placeholder="Search, type an address, or a command..."></div>
    <div id="res"></div>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> open</span><span><kbd>Alt+Enter</kbd> new tab</span><span id="ver"></span></div>
  </div>
</div>
<div class="edge n" data-d="n"></div><div class="edge s" data-d="s"></div><div class="edge e" data-d="e"></div><div class="edge w" data-d="w"></div>
<div class="edge ne" data-d="ne"></div><div class="edge nw" data-d="nw"></div><div class="edge se" data-d="se"></div><div class="edge sw" data-d="sw"></div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);

  let prefs = ZB.load();
  let S = { tabs: [], active: 0, panel: false, back: false, fwd: false, closed: 0, version: "", max: false };
  const els = new Map();   // tab id -> element
  let keys = ZB.keymap(prefs);

  // ---------------------------------------------------------------- look
  function applyPrefs() {
    prefs = ZB.load();
    ZB.apply(prefs);
    keys = ZB.keymap(prefs);
    document.documentElement.style.setProperty("--pw", Math.max(300, prefs.panelWidth | 0) + "px");
    placeTabs();
    send({ c: "keys", list: Object.values(keys).filter(Boolean) });
    send({ c: "prefs", sleepAfter: prefs.sleepAfter | 0 });
    requestAnimationFrame(layout);
    setTimeout(indicator, 60);
    setTimeout(art, 30);
  }
  // art: animated pixel sky behind everything + pixel waves in the command bar
  let rebuildSky = null;
  function art() {
    const css = getComputedStyle(document.documentElement), v = (k) => css.getPropertyValue(k).trim();
    const side = prefs.tabs === "side";
    const o = side ? { moon: [0.09, 0.6, 6], ridge: 0.16, torii: 0.035, wisps: 7 } : { moon: [0.8, 0.035, 5], ridge: 0, torii: false, wisps: 6 };
    if (!rebuildSky) rebuildSky = ZB.sky($("#sky"), o);
    else rebuildSky(o);
    ZB.seigaiha($("#pwaves"), v("--panel"), ZB.mix(v("--panel"), v("--acc"), 0.35));
    ZB.seigaiha($("#waves"), v("--panel"), ZB.mix(v("--panel"), v("--acc"), 0.3), 0.5);
  }
  // little pixel bursts when tabs open and close
  function burst(el, n, closing) {
    if (document.documentElement.dataset.motion === "reduced" || !el) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      s.className = "spark" + (i % 2 ? " g" : "");
      const a = Math.random() * 6.28, d = 14 + Math.random() * 22;
      s.style.left = cx + (Math.random() - 0.5) * r.width * 0.6 + "px"; s.style.top = cy + "px";
      s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", (Math.sin(a) * d - (closing ? 10 : 0)) + "px");
      document.body.appendChild(s);

    if (!side && tabs.parentNode !== host) { const brand = $("#bar .brand"); brand.after(tabs); tabs.after(nt); }
    $("#b-side").classList.toggle("on", side);
  }
  function icons() {
    const set = (id, n, s) => { const e = $(id); if (e) e.insertAdjacentHTML("afterbegin", ZB.icon(n, s)); };
    set("#newtab", "plus", 2); set("#mask1", "mask", 2); set("#mask2", "mask", 2); set("#b-back", "back", 2); set("#b-fwd", "fwd", 2); set("#b-reload", "reload", 2);
    set("#b-claude", "claude", 2); set("#b-side", "side", 2); set("#b-menu", "menu", 2.4);
    set("#p-home", "plus", 2); set("#p-pop", "pop", 2); set("#p-close", "close", 2);
    set("#qi", "search", 2.4);
    document.querySelectorAll(".winbtns").forEach((w) => {
      w.innerHTML = `<button data-w="min" title="Minimise">${ZB.icon("min", 1.7)}</button>` +
        `<button data-w="max" class="mx" title="Maximise">${ZB.icon("max", 1.7)}</button>` +
        `<button data-w="close" class="x" title="Close">${ZB.icon("close", 1.7)}</button>`;
    });
  }

  // ---------------------------------------------------------------- layout -> Rust (where pages go)
  let lastL = "";
  function layout() {
    const f = $("#frame").getBoundingClientRect(), p = $("#parea").getBoundingClientRect();
    const r = (n) => Math.round(n * 100) / 100;
    const L = { c: "layout", cx: r(f.left + 2), cy: r(f.top + 2), cw: r(f.width - 4), ch: r(f.height - 4),
      px: r(p.left + 2), py: r(p.top), pw: r(Math.max(0, p.width - 4)), ph: r(Math.max(0, p.height - 2)) };
    const k = JSON.stringify(L);
    if (k !== lastL) { lastL = k; send(L); }
  }
  const ro = new ResizeObserver(() => requestAnimationFrame(layout));
  ro.observe($("#frame")); ro.observe($("#parea")); ro.observe(document.body);
  window.addEventListener("resize", () => { requestAnimationFrame(layout); indicator(); });

  // ---------------------------------------------------------------- tabs
  function tabIcon(t) {
    if (t.asleep) return ZB.icon("zzz", 2);
    if (t.url && t.url.startsWith("zenko://")) return `<img src="zenko.png" alt="" style="image-rendering:pixelated">`;
    if (t.icon) return `<img src="${t.icon.replace(/"/g, "&quot;")}" alt="" onerror="this.replaceWith(document.createTextNode('${letter(t)}'))">`;
    return letter(t);
  }
  function letter(t) {
    const h = host(t.url) || t.title || "?";
    return (h.replace(/^www\./, "")[0] || "?").toUpperCase().replace(/[^A-Z0-9]/, "•");
  }
  function host(u) { try { return new URL(u).hostname; } catch (e) { return ""; } }
  function renderTabs() {
    const box = $("#tabs");
    const seen = new Set();
    let prev = $("#ind");
    S.tabs.forEach((t) => {
      seen.add(t.id);
      let el = els.get(t.id);
      if (!el) {
        el = document.createElement("div");
        el.className = "tab";
        el.dataset.id = t.id;
        el.draggable = true;
        el.innerHTML = `<span class="ic"></span><span class="t"></span><span class="aud"></span><button class="x" title="Close (Ctrl+W)">${ZB.icon("close", 1.4)}</button>`;
        els.set(t.id, el);
        wireTab(el, t.id);
        if (booted) setTimeout(() => burst(el, 8, false), 120);
      }
      const ic = el.querySelector(".ic"), key = (t.asleep ? "z" : "") + t.icon + "|" + host(t.url);
      if (ic.dataset.k !== key) { ic.dataset.k = key; ic.innerHTML = tabIcon(t); }
      const title = t.title || host(t.url) || "New tab";
      el.querySelector(".t").textContent = title;
      el.title = title + (t.url && !t.url.startsWith("zenko://") ? "\n" + t.url : "");
      const aud = el.querySelector(".aud"), ak = t.muted ? "m" : "s";
      if (aud.dataset.k !== ak) { aud.dataset.k = ak; aud.innerHTML = ZB.icon(t.muted ? "muted" : "sound", 1.5); aud.title = t.muted ? "Unmute" : "Mute"; }
      el.classList.toggle("active", t.id === S.active);
      el.classList.toggle("loading", !!t.loading);
      el.classList.toggle("audio", !!t.audio);
      el.classList.toggle("muted", !!t.muted);
      el.classList.toggle("asleep", !!t.asleep);
      if (prev.nextSibling !== el) prev.after(el);
      prev = el;
    });
    for (const [id, el] of els) {
      if (!seen.has(id)) {
        els.delete(id);
        burst(el, 7, true);
        el.classList.add("leave");
        setTimeout(() => el.remove(), 260);
      }
    }
    setTimeout(indicator, 0);
    setTimeout(indicator, 270);
  }
  function indicator() {
    const ind = $("#ind"), el = els.get(S.active);
    if (!el) { ind.style.width = "0"; return; }
    if (prefs.tabs === "side") {
      ind.style.height = el.offsetHeight * 0.6 + "px";
      ind.style.transform = `translateY(${el.offsetTop + el.offsetHeight * 0.2}px)`;
    } else {
      ind.style.height = "";
      const w = Math.max(16, el.offsetWidth * 0.55);
      ind.style.width = w + "px";
      ind.style.transform = `translateX(${el.offsetLeft + (el.offsetWidth - w) / 2}px)`;
    }
  }
  let dragId = 0, booted = false;
  setTimeout(() => { booted = true; }, 1200);
  function wireTab(el, id) {
    el.addEventListener("mousedown", (e) => {
      if (e.button === 0 && !e.target.closest(".x,.aud")) send({ c: "activate", id });
    });
    el.addEventListener("auxclick", (e) => { if (e.button === 1) { e.preventDefault(); send({ c: "close", id }); } });
    el.querySelector(".x").addEventListener("click", (e) => { e.stopPropagation(); send({ c: "close", id }); });
    el.querySelector(".aud").addEventListener("click", (e) => { e.stopPropagation(); send({ c: "mute", id }); });
    el.addEventListener("dragstart", (e) => { dragId = id; el.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => { el.classList.remove("drag"); document.querySelectorAll(".tab.over").forEach((x) => x.classList.remove("over")); });
    el.addEventListener("dragover", (e) => { if (dragId) { e.preventDefault(); el.classList.add("over"); } });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", (e) => {
      e.preventDefault(); el.classList.remove("over");
      if (!dragId || dragId === id) return;
      const from = S.tabs.findIndex((t) => t.id === dragId);
      let to = S.tabs.findIndex((t) => t.id === id);
      if (from < to) to -= 1;
      send({ c: "move", id: dragId, to: Math.max(0, to) });
      dragId = 0;
    });
  }

  // ---------------------------------------------------------------- toolbar + address
  function activeTab() { return S.tabs.find((t) => t.id === S.active); }
  function renderTools() {
    $("#b-back").disabled = !S.back; $("#b-fwd").disabled = !S.fwd;
    const t = activeTab() || {};
    const r = $("#b-reload"), want = t.loading ? "stop" : "reload";
    if (r.dataset.k !== want) { r.dataset.k = want; r.innerHTML = ZB.icon(want, 2); r.title = t.loading ? "Stop" : "Reload (F5)"; }
    $("#fire").classList.toggle("on", !!t.loading);
    const a = $("#addr");
    let h = "", rest = "", secure = false;
    const u = t.url || "";
    if (!u || u.startsWith("zenko://")) { a.innerHTML = `${ZB.icon("search", 2)}<span class="path">Search or type an address</span><kbd>Ctrl K</kbd>`; }
    else {
      try { const x = new URL(u); secure = x.protocol === "https:"; h = x.hostname.replace(/^www\./, ""); rest = (x.pathname === "/" ? "" : x.pathname) + x.search; }
      catch (e) { rest = u; }
      a.innerHTML = (secure ? `<span class="lock" title="Secure connection">${ZB.icon("lock", 2)}</span>` : ZB.icon("search", 2)) +
        `<span class="host"></span><span class="path"></span><kbd>Ctrl K</kbd>`;
      a.querySelector(".host").textContent = h; a.querySelector(".path").textContent = rest;
    }
    $("#b-claude").classList.toggle("on", S.panel);
    document.documentElement.dataset.panel = S.panel ? "on" : "off";
    document.documentElement.dataset.max = S.max ? "on" : "off";
    document.querySelectorAll(".winbtns .mx").forEach((b) => { b.innerHTML = ZB.icon(S.max ? "rest" : "max", 1.7); b.title = S.max ? "Restore" : "Maximise"; });
    $("#ver").textContent = "Zenko Browser " + (S.version || "");
    requestAnimationFrame(layout);
  }

  // ---------------------------------------------------------------- window controls
  document.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    const wb = e.target.closest("[data-w]");
    if (wb) return;
    const ed = e.target.closest(".edge");
    if (ed) { send({ c: "win", a: "resize", d: ed.dataset.d }); return; }
    if (e.target.closest("button,input,.tab,#addr,#split,#notice")) return;
    if (e.target.closest("[data-drag]")) {
      if (e.detail === 2) send({ c: "win", a: "max" });
      else send({ c: "win", a: "drag" });
    }
  });
  document.addEventListener("click", (e) => {
    const wb = e.target.closest("[data-w]");
    if (wb) send({ c: "win", a: wb.dataset.w });
  });
  $("#newtab").onclick = () => send({ c: "new" });
  $("#b-back").onclick = () => send({ c: "back" });
  $("#b-fwd").onclick = () => send({ c: "fwd" });
  $("#b-reload").onclick = () => send({ c: (activeTab() || {}).loading ? "stop" : "reload" });
  $("#b-claude").onclick = () => send({ c: "panel" });
  $("#b-side").onclick = () => toggleSide();
  $("#b-menu").onclick = () => openPal("new", "");
  $("#addr").onmousedown = (e) => { e.preventDefault(); openPal("here", currentUrl()); };
  $("#p-home").onclick = () => send({ c: "panelHome" });
  $("#p-pop").onclick = () => send({ c: "popout" });
  $("#p-close").onclick = () => send({ c: "panel", open: false });
  function currentUrl() { const u = (activeTab() || {}).url || ""; return u.startsWith("zenko://newtab") ? "" : u; }
  function toggleSide() { prefs.tabs = prefs.tabs === "side" ? "top" : "side"; ZB.save(prefs); applyPrefs(); }

  // Claude panel splitter
  (function () {
    const sp = $("#split");
    let x0 = 0, w0 = 0, on = false;
    sp.addEventListener("pointerdown", (e) => { on = true; x0 = e.clientX; w0 = $("#panel").offsetWidth; sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); });
    sp.addEventListener("pointermove", (e) => {
      if (!on) return;
      const max = Math.max(320, window.innerWidth * 0.7);
      const w = Math.min(max, Math.max(300, w0 + (x0 - e.clientX)));
      document.documentElement.style.setProperty("--pw", w + "px");
      requestAnimationFrame(layout);
    });
    const end = () => { if (!on) return; on = false; sp.classList.remove("drag"); prefs = ZB.load(); prefs.panelWidth = $("#panel").offsetWidth; ZB.save(prefs); };
    sp.addEventListener("pointerup", end); sp.addEventListener("lostpointercapture", end);
  })();

  // ---------------------------------------------------------------- command bar (Ctrl+K / address bar)
  let palMode = "new", items = [], sel = 0, palOpen = false, shownSent = false, shotTimer = 0;
  const q = $("#q");
  function openPal(mode, text) {
    palMode = mode;
    q.value = text || "";
    build();
    if (palOpen) { q.focus(); q.select(); return; }
    palOpen = true; shownSent = false;
    $("#shot-page").removeAttribute("src"); $("#shot-panel").removeAttribute("src");
    $("#shot-page").style.display = $("#shot-panel").style.display = "none";
    $("#ov").classList.add("open");
    send({ c: "overlay", on: true });
    clearTimeout(shotTimer);
    shotTimer = setTimeout(shown, 450); // in case a picture never arrives
  }
  function shown() {
    if (!palOpen || shownSent) return;
    shownSent = true;
    clearTimeout(shotTimer);
    send({ c: "shown" });
    requestAnimationFrame(() => { $("#ov").classList.add("show"); q.focus(); q.select(); });
    setTimeout(() => { q.focus(); }, 60);
  }
  function closePal(keepFocus) {
    if (!palOpen) return;
    palOpen = false;
    $("#ov").classList.remove("show");
    send({ c: "overlay", on: false });
    setTimeout(() => { if (!palOpen) $("#ov").classList.remove("open"); }, 200);
  }
  function placeShot(img, sel) {
    const r = $(sel).getBoundingClientRect();
    Object.assign(img.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", display: "block" });
  }
  let shotsLeft = 0;
  window.zbShot = function (k, data) {
    const img = k === "panel" ? $("#shot-panel") : $("#shot-page");
    if (!data) return;
    placeShot(img, k === "panel" ? "#parea" : "#frame");
    img.src = data;
  };
  function cmdList() {
    const t = activeTab() || {};
    return [
      ["New tab", "plus", () => send({ c: "new" }), "newTab"],
      ["Close tab", "close", () => send({ c: "close", id: S.active }), "closeTab"],
      ["Reopen closed tab", "reload", () => send({ c: "reopen" }), "reopen"],
      [S.panel ? "Close Claude panel" : "Open Claude panel", "claude", () => send({ c: "panel" }), "claude"],
      ["Pop Claude out into its own window", "pop", () => send({ c: "popout" })],
      [prefs.tabs === "side" ? "Tabs on top" : "Tabs on the side", "side", toggleSide, "sideTabs"],
      [t.muted ? "Unmute this tab" : "Mute this tab", "sound", () => send({ c: "mute", id: S.active }), "mute"],
      ["Settings and look", "gear", () => send({ c: "new", url: "zenko://settings" }), "settings"],
      ["Zoom in", "plus", () => zoom(0.1)], ["Zoom out", "min", () => zoom(-0.1)], ["Reset zoom", "search", () => zoom(0)],
      ["Print or save as PDF", "home", () => send({ c: "print" })],
      ["Developer tools (DevTools)", "gear", () => send({ c: "devtools" })],
      ["Check for updates", "star", () => { note("Checking for updates..."); send({ c: "update" }); }],
      ["Open the browser's data folder", "home", () => send({ c: "openData" })],
    ];
  }
  let zoomF = 1;
  function zoom(d) { zoomF = d === 0 ? 1 : Math.min(3, Math.max(0.3, zoomF + d)); send({ c: "zoom", f: zoomF }); note("Zoom " + Math.round(zoomF * 100) + "%", 1500); }
  function fuzzy(text, qq) {
    text = (text || "").toLowerCase();
    if (!qq) return 1;
    let score = 0;
    for (const w of qq.split(/\s+/).filter(Boolean)) {
      const i = text.indexOf(w);
      if (i < 0) return 0;
      score += i === 0 ? 3 : (text[i - 1] === " " || text[i - 1] === "/" || text[i - 1] === ".") ? 2 : 1;
    }
    return score;
  }
  function build() {
    const text = q.value.trim(), ql = text.toLowerCase();
    items = [];
    const add = (grp, o) => items.push(Object.assign({ grp }, o));
    const val = ZB.calc(text);
    if (val !== null) add("", { cls: "calc", ic: "=", title: "= " + val.toLocaleString("en", { maximumFractionDigits: 10 }), sub: "Enter copies the answer", run: () => navigator.clipboard && navigator.clipboard.writeText(String(val)) });
    if (text) {
      const url = ZB.toUrl(text, prefs);
      const isSearch = url !== text && !/^https?:\/\/[^ ]+$/.test(text) && url.indexOf(encodeURIComponent(text)) > 0 && !/^https?:\/\//.test(text) && !/^[^\s]+\.[a-z]{2,}/i.test(text);
      add("", { ic: isSearch ? ZB.icon("search", 2) : ZB.icon("fwd", 2),
        title: isSearch ? `Search ${(ZB.ENGINES[prefs.engine] || ZB.ENGINES.google)[1]} for “${text}”` : url,
        sub: palMode === "here" ? "Open here" : "Open in a new tab", url });
    }
    const tabs = S.tabs.map((t) => ({ t, s: fuzzy((t.title || "") + " " + (t.url || ""), ql) })).filter((x) => x.s > 0 && (ql || x.t.id !== S.active));
    tabs.sort((a, b) => b.s - a.s);
    tabs.slice(0, ql ? 6 : 8).forEach(({ t }) => add("Open tabs", { ic: tabIcon(t), title: t.title || t.url, sub: t.url, tag: "Switch", run: () => send({ c: "activate", id: t.id }) }));
    ZB.sites(prefs).forEach(([name, u, l]) => { if (ql && fuzzy(name + " " + u, ql)) add("Sites", { ic: l, title: name, sub: u, url: u }); });
    cmdList().forEach(([name, ic, run, k]) => {
      if (fuzzy(name, ql) || !ql) add("Commands", { ic: ZB.icon(ic, 2), title: name, run, kbd: k && keys[k] ? ZB.keyName(keys[k]) : "" });
    });
    if (!ql) items = items.filter((i) => i.grp !== "Commands" || items.indexOf(i) < 30);
    sel = 0;
    draw();
  }
  function draw() {
    const box = $("#res");
    box.innerHTML = "";
    let g = null;
    items.forEach((it, i) => {
      if (it.grp && it.grp !== g) { g = it.grp; const h = document.createElement("div"); h.className = "grp"; h.textContent = g; box.appendChild(h); }
      const d = document.createElement("div");
      d.className = "it" + (i === sel ? " sel" : "") + (it.cls ? " " + it.cls : "");
      d.innerHTML = `<span class="ic"></span><span class="tx"><div class="tt"></div><div class="sb"></div></span>`;
      const ic = d.querySelector(".ic");
      if (/^</.test(it.ic || "")) ic.innerHTML = it.ic; else ic.textContent = it.ic || "";
      d.querySelector(".tt").textContent = it.title || "";
      d.querySelector(".sb").textContent = it.sub || "";
      if (!it.sub) d.querySelector(".sb").remove();
      if (it.kbd) { const k = document.createElement("kbd"); k.textContent = it.kbd; d.appendChild(k); }
      else if (it.tag) { const k = document.createElement("span"); k.className = "tag"; k.textContent = it.tag; d.appendChild(k); }
      d.onmousemove = () => { if (sel !== i) { sel = i; mark(); } };
      d.onclick = () => choose(i, false);
      box.appendChild(d);
    });
  }
  function mark() {
    const all = $("#res").querySelectorAll(".it");
    all.forEach((e, i) => e.classList.toggle("sel", i === sel));
    const s = all[sel]; if (s) s.scrollIntoView({ block: "nearest" });
  }
  function choose(i, newTab) {
    const it = items[i];
    if (!it) return;
    closePal();
    if (it.url) {
      if (palMode === "here" && !newTab) send({ c: "go", url: it.url });
      else send({ c: "new", url: it.url });
    } else if (it.run) setTimeout(it.run, 30);
  }
  q.addEventListener("input", build);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); mark(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); }
    else if (e.key === "Enter") { e.preventDefault(); choose(sel, e.altKey); }
    else if (e.key === "Escape") { e.preventDefault(); closePal(); }
  });
  $("#ov .dim").addEventListener("mousedown", () => closePal());
  $("#ov").addEventListener("mousedown", (e) => { if (e.target.classList.contains("shot")) closePal(); });

  // ---------------------------------------------------------------- shortcuts (sent by Rust from any page)
  const ACT = {
    newTab: () => send({ c: "new" }),
    closeTab: () => palOpen ? closePal() : send({ c: "close", id: S.active }),
    reopen: () => send({ c: "reopen" }),
    nextTab: () => step(1), prevTab: () => step(-1),
    palette: () => palOpen ? closePal() : openPal("new", ""),
    address: () => openPal("here", currentUrl()), address2: () => openPal("here", currentUrl()),
    claude: () => send({ c: "panel" }),
    sideTabs: toggleSide,
    mute: () => send({ c: "mute", id: S.active }),
    settings: () => send({ c: "new", url: "zenko://settings" }),
    lastTab: () => { const t = S.tabs[S.tabs.length - 1]; if (t) send({ c: "activate", id: t.id }); },
  };
  for (let n = 1; n <= 8; n++) ACT["tab" + n] = () => { const t = S.tabs[n - 1]; if (t) send({ c: "activate", id: t.id }); };
  function step(d) {
    const i = S.tabs.findIndex((t) => t.id === S.active);
    if (i < 0 || !S.tabs.length) return;
    const t = S.tabs[(i + d + S.tabs.length) % S.tabs.length];
    send({ c: "activate", id: t.id });
  }

  // ---------------------------------------------------------------- notices
  let noteT = 0;
  function note(text, ms, btn) {
    const n = $("#notice");
    n.textContent = text;
    if (btn) { const b = document.createElement("button"); b.className = "btn on"; b.style.height = "1.6rem"; b.textContent = btn[0]; b.onclick = btn[1]; n.appendChild(b); }
    n.classList.add("on");
    clearTimeout(noteT);
    if (ms) noteT = setTimeout(() => n.classList.remove("on"), ms);
  }

  // ---------------------------------------------------------------- API used by Rust
  window.zb = {
    state(s) { S = s; renderTabs(); renderTools(); if (palOpen) build(); },
    key(k) { for (const a in keys) if (keys[a] === k && ACT[a]) { ACT[a](); return; } },
    shot(k, data) { window.zbShot(k, data); },
    shotsDone() {
      const imgs = [$("#shot-page"), $("#shot-panel")].filter((i) => i.getAttribute("src"));
      if (!imgs.length) return shown();
      let left = imgs.length;
      imgs.forEach((i) => { if (i.complete) { if (--left === 0) shown(); } else i.onload = i.onerror = () => { if (--left === 0) shown(); }; });
    },
    update(v) {
      if (v.state === "ready") note("Updated to " + v.version, 0, ["Restart", () => send({ c: "restart" })]);
      else if (v.state === "none") note("You have the newest version", 3000);
      else if (v.state === "error") note("Could not check for updates", 4000);
    },
    maximized(m) { S.max = m; renderTools(); },
    focusAddress() { openPal("here", ""); },
  };
  window.addEventListener("storage", (e) => { if (e.key === "zb.prefs") applyPrefs(); });

  icons();
  applyPrefs();
  ZB.starfield && ZB.starfield($("#stars"));

  send({ c: "ready" });
})();
</script>
</body>
</html>
