<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zenko Browser</title>
<link rel="stylesheet" href="theme.css">
<script src="prefs.js"></script>
<style>
  body { user-select: none; background: var(--night); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #app { position: fixed; inset: 0; display: flex; z-index: 1; }

  /* ---------- side tabs column */
  #sidecol { display: none; width: 15.5rem; flex: none; flex-direction: column; padding: .5rem 0 .6rem .55rem; gap: .35rem; }
  [data-tabs="side"] #sidecol { display: flex; }
  #sidetop { display: flex; align-items: center; height: 2.4rem; }
  #col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { height: 3rem; display: flex; align-items: flex-end; padding: 0 0 0 .5rem; gap: .25rem; flex: none; position: relative; }
  [data-tabs="side"] #bar { display: none; }
  .brand { display: flex; align-items: center; gap: .45rem; height: 2.4rem; padding: 0 .55rem 0 .25rem; flex: none; align-self: center; cursor: default; }
  .brand .mask { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--glow) 55%, transparent)); animation: bob 4s cubic-bezier(.2,.8,.2,1) infinite; }
  @keyframes bob { 50% { transform: translateY(-1px); } }
  .brand b { font-family: "DotGothic16", var(--font); font-weight: 400; font-size: 1.05rem; letter-spacing: .28em; color: var(--gold); text-shadow: 0 0 10px color-mix(in srgb, var(--gold) 40%, transparent), 2px 2px 0 rgba(0,0,0,.35); }
  [data-tabs="top"] .brand b { display: none; }
  .grow { flex: 1; align-self: stretch; }
  .winbtns { display: flex; align-self: flex-start; flex: none; position: relative; z-index: 3; }
  .winbtns button { width: 3.2rem; height: 2.3rem; display: grid; place-items: center; color: var(--grey); transition: background .12s, color .12s; }
  .winbtns button:hover { background: color-mix(in srgb, var(--hover) 80%, transparent); color: var(--ink); }
  .winbtns button.x:hover { background: #c42b3c; color: #fff; }
  #tools .winbtns { display: none; margin: 0 -.6rem 0 .35rem; }
  [data-tabs="side"] #tools .winbtns { display: flex; }

  /* ---------- tabs */
  #tabs { position: relative; display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; height: 100%; padding-top: .45rem; }
  [data-tabs="side"] #tabs { flex-direction: column; align-items: stretch; overflow-y: auto; overflow-x: hidden; height: auto; flex: 0 1 auto; padding: .1rem .3rem .2rem 0; gap: 3px; }
  .tab {
    position: relative; flex: 1 1 14rem; max-width: 15rem; min-width: 2.8rem; height: 2.45rem; display: flex; align-items: center; gap: .55rem;
    padding: 0 .4rem 0 .75rem; color: color-mix(in srgb, var(--ink) 72%, var(--grey)); cursor: default; clip-path: var(--cliptop);
    transition: background .16s, color .16s, max-width .24s cubic-bezier(.2,.8,.2,1), opacity .2s, transform .2s cubic-bezier(.2,.8,.2,1);
    animation: tabIn .32s cubic-bezier(.2,.9,.25,1.25);
  }
  [data-density="compact"] .tab { height: 2.15rem; }
  .tab:hover { background: color-mix(in srgb, var(--panel) 55%, transparent); color: var(--ink); }
  .tab.active { background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--gold), inset 2px 0 0 color-mix(in srgb, var(--gold) 35%, transparent), inset -2px 0 0 color-mix(in srgb, var(--gold) 35%, transparent); }
  .tab.active::after { content: ""; position: absolute; left: 6px; right: 6px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #fff8, transparent); background-size: 40% 100%; background-repeat: no-repeat;
    animation: shimmer 3.2s cubic-bezier(.2,.8,.2,1) infinite; }
  @keyframes shimmer { from { background-position: -60% 0; } to { background-position: 160% 0; } }
  .tab.leave { max-width: 0 !important; min-width: 0; opacity: 0; padding: 0; pointer-events: none; }
  .tab.drag { opacity: .45; }
  .tab.over::before { content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  @keyframes tabIn { from { max-width: 0; opacity: 0; transform: translateY(10px); } }
  [data-shape="round"] .tab { clip-path: none; border-radius: var(--r) var(--r) 0 0; }
  [data-shape="pill"] .tab { clip-path: var(--clips); height: 2.05rem; margin-bottom: .3rem; }
  [data-shape="pill"] .tab.active { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent); }
  [data-shape="square"] .tab { clip-path: none; }
  [data-tabs="side"] .tab { flex: none; max-width: none; height: 2.3rem; clip-path: var(--clips); animation-name: tabInSide; margin: 0; }
  [data-tabs="side"] .tab.active { box-shadow: inset 2px 0 0 var(--gold), inset 0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); }
  [data-tabs="side"] .tab.leave { max-height: 0; height: 0; }
  [data-tabs="side"] .tab.over::before { left: 10%; right: 10%; top: 0; bottom: auto; width: auto; height: 2px; }
  @keyframes tabInSide { from { opacity: 0; transform: translateX(-12px); height: 0; } }
  .tab .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--accbg); color: var(--acc); overflow: hidden; clip-path: var(--clips); }
  .tab .ic img { width: 16px; height: 16px; }
  .tab.active .ic { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 60%, transparent)); }
  .tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); font-size: 1rem; }
  .tab.asleep .t, .tab.asleep .ic { opacity: .45; }
  .tab .aud { color: var(--gold); display: none; padding: 2px; }
  .tab .aud svg { animation: blip 1s cubic-bezier(.2,.8,.2,1) infinite; }
  .tab.muted .aud svg { animation: none; }
  @keyframes blip { 50% { transform: translateY(-1px); } }
  .tab .aud:hover { background: var(--hover); }
  .tab.audio .aud, .tab.muted .aud { display: block; }
  .tab .x { width: 1.5rem; height: 1.5rem; display: grid; place-items: center; color: var(--grey); opacity: 0; transition: opacity .12s, background .12s; flex: none; clip-path: var(--clips); }
  .tab:hover .x, [data-tabs="top"] .tab.active .x { opacity: 1; }
  .tab .x:hover { background: color-mix(in srgb, #c42b3c 70%, transparent); color: #fff; }
  .tab.loading .ic { animation: flick .9s cubic-bezier(.2,.8,.2,1) infinite; }
  @keyframes flick { 50% { filter: drop-shadow(0 0 5px var(--glow)) brightness(1.4); transform: scale(.85); } }
  #ind { display: none; }
  #newtab { flex: none; align-self: center; margin-bottom: .1rem; }
  [data-tabs="side"] #newtab { align-self: stretch; justify-content: flex-start; padding-left: .75rem; margin: .15rem .3rem 0 0; height: 2.3rem; gap: .6rem; }
  #newtab span { display: none; }
  [data-tabs="side"] #newtab span { display: inline; }

  /* pixel sparkles (tab open / close) */
  .spark { position: fixed; width: 3px; height: 3px; background: var(--gold); pointer-events: none; z-index: 80; box-shadow: 0 0 4px var(--gold); animation: spark .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .spark.g { background: var(--glow); box-shadow: 0 0 4px var(--glow); }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

  /* ---------- toolbar */
  #tools { height: 3.15rem; display: flex; align-items: center; gap: .15rem; padding: 0 .55rem; flex: none; position: relative;
    background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), color-mix(in srgb, var(--panel) 80%, transparent)); }
  #tools canvas.waves { position: absolute; right: 0; top: 0; height: 100%; width: 42%; opacity: .45; z-index: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 75%); }
  .lantern { width: 18px; flex: none; align-self: flex-start; margin: 0 .2rem 0 .1rem; position: relative; height: 2.7rem; }
  .lantern::before { content: ""; position: absolute; left: 6px; top: 0; width: 2px; height: 1rem; background: color-mix(in srgb, var(--gold) 60%, transparent); }
  .lantern i { position: absolute; left: -2px; top: 1rem; width: 18px; height: 20px; background: #d9472b; clip-path: var(--clips);
    box-shadow: inset 0 3px 0 #8f2a1a, inset 0 -3px 0 #8f2a1a; animation: sway 3.4s cubic-bezier(.2,.8,.2,1) infinite alternate; transform-origin: 7px -1rem; }
  .lantern i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 6px; height: 8px; background: #ffd27a; box-shadow: 0 0 10px 4px color-mix(in srgb, #ffb347 55%, transparent); animation: glowp 1.8s cubic-bezier(.2,.8,.2,1) infinite; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  @keyframes glowp { 50% { opacity: .65; } }
  .corner { position: absolute; width: 12px; height: 12px; z-index: 3; pointer-events: none; }
  .corner::before, .corner::after { content: ""; position: absolute; background: var(--gold); }
  .corner::before { width: 12px; height: 2px; } .corner::after { width: 2px; height: 12px; }
  .corner.tl { left: -4px; top: -4px; } .corner.tr { right: -4px; top: -4px; transform: scaleX(-1); }
  .corner.bl { left: -4px; bottom: -4px; transform: scaleY(-1); } .corner.br { right: -4px; bottom: -4px; transform: scale(-1); }
  .corner i { position: absolute; left: 4px; top: 4px; width: 2px; height: 2px; background: var(--gold); box-shadow: 0 0 4px var(--gold); }

  .glint { position: absolute; width: 10px; height: 2px; background: #fff; box-shadow: 0 0 6px var(--gold); z-index: 3; pointer-events: none; offset-path: inset(0 round 0); opacity: .8;
    animation: orbit 14s linear infinite; }
  @keyframes orbit { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  #tools::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; pointer-events: none;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--gold) 55%, transparent) 0 4px, transparent 4px 8px); opacity: .55; }
  [data-tabs="side"] #tools { background: color-mix(in srgb, var(--panel) 55%, transparent); margin: .5rem .55rem 0 0; clip-path: var(--clip); }
  [data-tabs="side"] #tools::after { display: none; }
  [data-density="compact"] #tools { height: 2.7rem; }
  #tools > * { position: relative; z-index: 1; }
  .btn { clip-path: var(--clips); border-radius: 0; height: 2.25rem; min-width: 2.25rem; }
  .btn:hover { background: color-mix(in srgb, var(--hover) 90%, transparent); color: var(--ink); }
  .btn:hover svg { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--glow) 70%, transparent)); }
  .btn:active { transform: translateY(1px); }
  .btn.on { color: var(--night); background: var(--acc); }
  .btn.on svg { filter: none; }
  #addr { flex: 1; max-width: 48rem; height: 2.3rem; display: flex; align-items: center; gap: .55rem; padding: 0 .4rem 0 .8rem; margin: 0 .45rem;
    --b: color-mix(in srgb, var(--line) 70%, var(--gold) 30%); --c: color-mix(in srgb, var(--night) 65%, var(--field)); color: var(--grey); cursor: text; min-width: 0; overflow: hidden; }
  #addr:hover { --b: color-mix(in srgb, var(--gold) 80%, var(--line)); }
  #addr::after { content: ""; position: absolute; inset: 2px; background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--gold) 14%, transparent) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 120% 0; pointer-events: none; }
  #addr:hover::after { animation: sweep .9s cubic-bezier(.2,.8,.2,1) 1; }
  @keyframes sweep { from { background-position: 120% 0; } to { background-position: -20% 0; } }
  #addr .host { color: var(--ink); white-space: nowrap; font-weight: 700; }
  #addr .path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #addr .lock { color: var(--gold); flex: none; }
  kbd { font: inherit; font-size: .8rem; color: var(--grey); padding: .05rem .4rem; flex: none; clip-path: var(--clips); background: color-mix(in srgb, var(--line) 70%, transparent); box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
  .spacer { flex: 1; }
  #notice { display: none; height: 2rem; padding: 0 .3rem 0 .85rem; --b: var(--gold); --c: var(--accbg); color: var(--ink); font-size: .95rem; white-space: nowrap; animation: pop .4s cubic-bezier(.2,.8,.2,1); }
  #notice.on { display: inline-flex; align-items: center; gap: .5rem; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  #b-claude.on { animation: breathe 2.6s ease-in-out infinite; }
  /* ---------- the Zenko link light */
  #b-zenko { position: relative; opacity: .5; transition: opacity .3s, color .3s; }
  #b-zenko.none { display: none; }
  #b-zenko.linked { opacity: 1; color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, transparent); animation: zglow 3.2s ease-in-out infinite; }
  #b-zenko::after { content: ""; position: absolute; right: .28rem; bottom: .3rem; width: 5px; height: 5px; background: var(--grey); box-shadow: 0 0 0 1px var(--night); }
  #b-zenko.linked::after { background: #5fd38a; box-shadow: 0 0 0 1px var(--night), 0 0 6px #5fd38a; }
  @keyframes zglow { 50% { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--gold) 70%, transparent)); } }
  /* ---------- a card over the page (summaries) */
  #zcard { position: absolute; display: none; left: 50%; top: 9vh; width: min(40rem, calc(100vw - 2rem)); max-height: 78vh; overflow-y: auto; transform: translateX(-50%);
    padding: 1.1rem 1.3rem 1rem; color: var(--ink); opacity: 0; --b: color-mix(in srgb, var(--gold) 80%, var(--line)); --c: var(--panel); }
  #ov.card #pal, #ov.card #tmenu { display: none; }
  #ov.card #zcard { display: block; }
  #ov.card.show #zcard { opacity: 1; animation: unfold .26s cubic-bezier(.2,.8,.2,1); }
  #zcard h3 { margin: 0; color: var(--gold); font-size: 1.15rem; display: flex; align-items: center; gap: .55rem; }
  #zcard .sub { color: var(--grey); font-size: .85rem; margin: .2rem 0 .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #zcard ul { margin: 0; padding: 0; list-style: none; }
  #zcard li { position: relative; padding: .38rem 0 .38rem 1.2rem; line-height: 1.45; border-bottom: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); }
  #zcard li::before { content: "✦"; position: absolute; left: 0; color: var(--gold); font-size: .8rem; top: .5rem; }
  #zcard .foot { color: var(--grey); font-size: .8rem; margin-top: .7rem; }
  #zcard .row { display: flex; gap: .5rem; margin-top: .9rem; flex-wrap: wrap; }
  #zcard .row .btn { height: 2rem; padding: 0 .85rem; }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 2px #fff6; } }

  /* ---------- page + Claude panel */
  #main { flex: 1; display: flex; padding: .55rem; min-height: 0; gap: 0; }
  [data-tabs="side"] #main { padding-left: 0; }
  #fwrap { position: relative; flex: 1; min-width: 0; }
  #frame { position: absolute; inset: 0; --b: color-mix(in srgb, var(--line) 45%, var(--gold) 55%); --c: var(--paper); }
  #frame .wisp { display: none; }
  #fire { position: absolute; left: 4px; right: 4px; top: 0; height: 2px; overflow: visible; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 2; }
  #fire.on { opacity: 1; }
  #fire::before { content: ""; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, var(--glow), #fff);
    animation: fire 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  #fire::after { content: ""; position: absolute; top: -2px; width: 6px; height: 6px; background: #fff; box-shadow: 0 0 0 2px var(--glow), 0 0 12px 3px var(--glow);
    clip-path: polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%); animation: fire2 1.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes fire { from { transform: translateX(-100%); } to { transform: translateX(333%); } }
  @keyframes fire2 { from { left: 0; } to { left: calc(100% - 6px); } }
  /* shoji door shown while a new tab loads, then it slides open */
  #door { position: absolute; inset: 2px; z-index: 2; display: none; overflow: hidden; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, color-mix(in srgb, #ffcf86 22%, var(--paper)) 0%, var(--paper) 70%); }
  #door.on { display: flex; }
  #door i { flex: 1; position: relative;
    background: linear-gradient(90deg, transparent calc(100% - 3px), #3d281a 0) 0 0 / 25% 100%, linear-gradient(0deg, transparent calc(100% - 3px), #3d281a 0) 0 0 / 100% 16.66%,
      linear-gradient(180deg, #f3ead6, #e6d7b6); border: 9px solid #2e1d12; box-shadow: inset 0 0 40px rgba(255,190,110,.35);
    transition: transform .8s cubic-bezier(.76,0,.24,1); }
  #door i::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(255,200,120,.35), transparent 70%); animation: lamp 2.2s ease-in-out infinite; }
  @keyframes lamp { 50% { opacity: .45; } }
  #door i:first-child { border-right-width: 5px; } #door i:nth-child(2) { border-left-width: 5px; }
  #door i:first-child::before, #door i:nth-child(2)::before { content: ""; position: absolute; top: 50%; width: 6px; height: 34px; margin-top: -17px; background: #2e1d12; border-radius: 3px; }
  #door i:first-child::before { right: 10px; } #door i:nth-child(2)::before { left: 10px; }
  #door .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); writing-mode: vertical-rl; font: 500 2.2rem/1 "Yu Mincho", "Zen Old Mincho", serif;
    letter-spacing: .45em; color: #c8402a; transition: opacity .35s; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  #door.open i:first-child { transform: translateX(-101%); }
  #door.open i:nth-child(2) { transform: translateX(101%); }
  #door.open .mark { opacity: 0; }
  [data-motion="reduced"] #door i { transition-duration: .2s !important; }
  #split { width: .6rem; flex: none; cursor: col-resize; display: none; position: relative; }
  #split::after { content: ""; position: absolute; left: 50%; top: 46%; height: 8%; width: 2px; margin-left: -1px; background: repeating-linear-gradient(180deg, var(--line) 0 4px, transparent 4px 6px); }
  #split:hover::after, #split.drag::after { background: repeating-linear-gradient(180deg, var(--gold) 0 4px, transparent 4px 6px); height: 18%; top: 41%; }
  #panel { display: none; flex-direction: column; flex: none; width: var(--pw, 430px); --b: color-mix(in srgb, var(--line) 45%, var(--gold) 55%); --c: var(--panel); animation: panelIn .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes panelIn { from { transform: translateX(36px); opacity: 0; } }
  [data-panel="on"] #panel { display: flex; }
  [data-panel="on"] #split { display: block; }
  .phead { height: 2.45rem; display: flex; align-items: center; gap: .1rem; padding: 0 .35rem 0 .85rem; flex: none; position: relative; }
  .phead::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .phead .dia { flex: 1; margin: 0; font-size: 1.02rem; color: var(--ink); }
  .phead .btn { height: 1.9rem; min-width: 1.9rem; padding: 0 .4rem; }
  #parea { flex: 1; position: relative; }

  /* ---------- window edges for resizing */
  .edge { position: fixed; z-index: 90; }
  .edge.n, .edge.s { left: 10px; right: 10px; height: 5px; } .edge.n { top: 0; cursor: ns-resize; } .edge.s { bottom: 0; cursor: ns-resize; }
  .edge.e, .edge.w { top: 10px; bottom: 10px; width: 5px; } .edge.e { right: 0; cursor: ew-resize; } .edge.w { left: 0; cursor: ew-resize; }
  .edge.ne, .edge.nw, .edge.se, .edge.sw { width: 10px; height: 10px; }
  .edge.ne { top: 0; right: 0; cursor: nesw-resize; } .edge.sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .edge.nw { top: 0; left: 0; cursor: nwse-resize; } .edge.se { bottom: 0; right: 0; cursor: nwse-resize; }
  [data-max="on"] .edge { display: none; }

  /* ---------- command bar */
  #ov { position: fixed; inset: 0; z-index: 60; display: none; }
  #ov.open { display: block; }
  #ov .shot { position: absolute; object-fit: fill; }
  #ov .dim { position: absolute; inset: 0; background: color-mix(in srgb, var(--night) 62%, transparent); backdrop-filter: blur(3px); opacity: 0; transition: opacity .18s; }
  #ov.show .dim { opacity: 1; }
  #pal { position: absolute; left: 50%; top: 12vh; width: min(46rem, calc(100vw - 2rem)); transform: translateX(-50%); opacity: 0; --b: color-mix(in srgb, var(--gold) 80%, var(--line)); --c: var(--panel); }
  #ov.show #pal { opacity: 1; animation: unfold .26s cubic-bezier(.2,.8,.2,1); }
  @keyframes unfold { from { transform: translateX(-50%) translateY(-10px) scale(.97); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  #pal .in { display: flex; align-items: center; gap: .75rem; padding: 1rem 1.15rem; color: var(--gold); position: relative; overflow: hidden; }
  #pal .in::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  #pal .in canvas.waves { position: absolute; right: 0; top: 0; height: 100%; width: 45%; opacity: .35; -webkit-mask-image: linear-gradient(90deg, transparent, #000 80%); }
  #pal .in > * { position: relative; }
  #q { flex: 1; background: none; border: 0; outline: 0; font-size: 1.35rem; min-width: 0; caret-color: var(--gold); }
  #q::placeholder { color: var(--grey); }
  #res { max-height: min(60vh, 31rem); overflow-y: auto; padding: .4rem; }
  .it { display: flex; align-items: center; gap: .8rem; padding: .55rem .75rem; color: var(--ink); clip-path: var(--clips); }
  .it .ic { width: 1.85rem; height: 1.85rem; display: grid; place-items: center; background: var(--field); color: var(--grey); flex: none; overflow: hidden; font-weight: 700; clip-path: var(--clips); }
  .it .ic img { width: 16px; height: 16px; }
  .it .tx { flex: 1; min-width: 0; }

<script>
(function () {

  // ---------------------------------------------------------------- layout -> Rust (where pages go)
  let lastL = "";

  }

    const split = S.split || [];
    vis.forEach((t) => {
      seen.add(t.id);
      let el = els.get(t.id);
      if (!el) {

        el.dataset.id = t.id;

        el.innerHTML = `<span class="ic"></span><span class="t"></span><span class="pf"></span><span class="bd"></span><span class="aud"></span><button class="x" title="Close (Ctrl+W)">${ZB.icon("close", 1.4)}</button>`;
        els.set(t.id, el);
        wireTab(el, t.id);
        if (booted) setTimeout(() => burst(el, 8, false), 120);

      const ic = el.querySelector(".ic"), key = (t.asleep ? "z" : "") + t.icon + "|" + host(t.url);

      const total = RECAP.reduce((a, b) => a + b.s, 0), top = RECAP[0].s;
      box.insertAdjacentHTML("beforeend", `<div class="empty" style="padding:.2rem .3rem .6rem">${fmtT(total)} on the web today (top sites)</div>`);
      RECAP.forEach((x) => { const d = li(x.h[0].toUpperCase(), x.h, fmtT(x.s)); d.querySelector(".tx").insertAdjacentHTML("beforeend", `<div class="bar"><i style="width:${Math.max(4, x.s / top * 100)}%"></i></div>`); box.appendChild(d); });
    }
  }

  // ---------------------------------------------------------------- clip part of the page for Zenko
  let clipOn = false, c0 = null;
  function clipStart() {
    if (palOpen) return;
    clipOn = true; ovKind = "clip";
    const ov = $("#ov");
    ov.classList.remove("menu"); ov.classList.add("clip");
    palOpen = true; shownSent = false;
    clearShots();
    ov.classList.add("open");
    send({ c: "overlay", on: true });
    clearTimeout(shotTimer);
    shotTimer = setTimeout(shown, 450);
  }
  $("#ov").addEventListener("mousedown", (e) => { if (!clipOn) return; c0 = [e.clientX, e.clientY]; $("#ov").classList.add("sel"); clipDraw(e); });
  $("#ov").addEventListener("mousemove", (e) => { if (clipOn && c0) clipDraw(e); });
  function clipDraw(e) { const b = $("#clipbox"); const x = Math.min(c0[0], e.clientX), y = Math.min(c0[1], e.clientY); Object.assign(b.style, { left: x + "px", top: y + "px", width: Math.abs(e.clientX - c0[0]) + "px", height: Math.abs(e.clientY - c0[1]) + "px" }); }
  $("#ov").addEventListener("mouseup", (e) => {
    if (!clipOn || !c0) return;
    const x = Math.min(c0[0], e.clientX), y = Math.min(c0[1], e.clientY), w = Math.abs(e.clientX - c0[0]), h = Math.abs(e.clientY - c0[1]);
    c0 = null;
    const img = Array.from(document.querySelectorAll("#ov .shot.pg")).find((i) => { const r = i.getBoundingClientRect(); return x + w / 2 >= r.left && x + w / 2 <= r.right && y + h / 2 >= r.top && y + h / 2 <= r.bottom; });
    if (w < 12 || h < 12 || !img) { closePal(); return; }
    const r = img.getBoundingClientRect(), sx = img.naturalWidth / r.width, sy = img.naturalHeight / r.height;
    const cv = document.createElement("canvas");
    cv.width = Math.round(Math.min(w, r.right - x) * sx); cv.height = Math.round(Math.min(h, r.bottom - y) * sy);
    cv.getContext("2d").drawImage(img, (Math.max(x, r.left) - r.left) * sx, (Math.max(y, r.top) - r.top) * sy, cv.width, cv.height, 0, 0, cv.width, cv.height);
    send({ c: "clip", data: cv.toDataURL("image/png") });
    closePal();
  });

  // ---------------------------------------------------------------- little helpers for Rust's messages
  function copyText(t) {
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => fallbackCopy(t)); else fallbackCopy(t);
  }
  function fallbackCopy(t) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [[880, 0], [1318.5, 0.12], [1760, 0.26]].forEach(([f, at]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + at); g.gain.exponentialRampToValueAtTime(0.16, ac.currentTime + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + at + 0.9);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + at); o.stop(ac.currentTime + at + 1);
      });
      setTimeout(() => ac.close(), 1800);
    } catch (e) {}
  }
  const MON = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const WD = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  function parseWhen(text) {
    const s = text.toLowerCase(), now = new Date();
    let d = null, m;
    if (/\btomorrow\b|\bdemain\b/.test(s)) { d = new Date(now); d.setDate(d.getDate() + 1); }
    else if (/\btoday\b|\btonight\b|\baujourd/.test(s)) d = new Date(now);
    else if ((m = s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/))) d = new Date(+m[1], +m[2] - 1, +m[3]);
    else if ((m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{4}))?/))) d = new Date(m[3] ? +m[3] : now.getFullYear(), MON.indexOf(m[2]), +m[1]);
    else if ((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/))) d = new Date(m[3] ? +m[3] : now.getFullYear(), MON.indexOf(m[1]), +m[2]);
    else if ((m = s.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/))) { let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000; d = new Date(y, +m[2] - 1, +m[1]); }
    else if ((m = s.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/))) { d = new Date(now); const want = WD.indexOf(m[1]); let add = (want - d.getDay() + 7) % 7; if (add === 0) add = 7; d.setDate(d.getDate() + add); }
    if (!d || isNaN(d)) return null;
    if (d < new Date(now.toDateString()) && !/\d{4}/.test(s)) d.setFullYear(d.getFullYear() + 1);
    let h = 8, mi = 0;
    if ((m = s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/))) { h = +m[1] % 12 + (m[3] === "pm" ? 12 : 0); mi = +(m[2] || 0); }
    else if ((m = s.match(/\b(\d{1,2}):(\d{2})\b/))) { h = +m[1]; mi = +m[2]; }
    else if (/\b(due|deadline|submit)\b/.test(s)) { h = 8; }
    d.setHours(h, mi, 0, 0);
    return d;
  }
  function cites(m) {
    const d = m.date ? new Date(m.date) : null, ok = d && !isNaN(d), now = new Date();
    const fmt = (x) => x.getDate() + " " + x.toLocaleString("en-GB", { month: "short" }) + ". " + x.getFullYear();
    const au = (m.author || "").trim();
    let inv = au;
    if (au && !/,/.test(au) && au.split(" ").length >= 2) { const p = au.split(" "); inv = p.pop() + ", " + p.join(" "); }
    const apaAu = au ? (au.includes(",") ? au : (() => { const p = au.split(" "); const last = p.pop(); return last + ", " + p.map((x) => x[0] + ".").join(" "); })()) : "";
    const t = (m.title || "").trim(), site = (m.site || "").trim(), url = m.url;
    const mla = (inv ? inv + ". " : "") + "“" + t + ".” " + (site ? site + ", " : "") + (ok ? fmt(d) + ", " : "") + url.replace(/^https?:\/\//, "") + ". Accessed " + fmt(now) + ".";
    const apa = (apaAu ? apaAu + " " : (site ? site + ". " : "")) + "(" + (ok ? d.getFullYear() + ", " + d.toLocaleString("en-GB", { month: "long" }) + " " + d.getDate() : "n.d.") + "). " + t + ". " + (apaAu && site ? site + ". " : "") + url;
    return { mla, apa };
  }
  // start-up routine: the sites you always open, once per launch
  let routineDone = false;
  function routine() {
    if (routineDone) return;
    routineDone = true;
    const wd = new Date().getDay(), list = (wd === 0 || wd === 6 ? prefs.startWeekend : prefs.startWeekday) || [];
    list.filter(Boolean).forEach((u) => {
      const url = ZB.toUrl(u, prefs);
      const h = siteOf(url);
      if (!S.tabs.some((t) => siteOf(t.url) === h)) send({ c: "new", url, bg: true });
    });
  }

  // ---------------------------------------------------------------- Zenko link
  let ZL = {};
  function openZenkoMenu() {
    const r = $("#b-zenko").getBoundingClientRect();
    const t = activeTab() || {}, web = /^https?:/.test(t.url || "");
    const dl = (ZL.deadlines || []).slice(0, 4);
    const day = (iso) => { const d = new Date(iso + "T00:00"); const n = Math.round((d - new Date(new Date().toDateString())) / 864e5); return n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; };
    menuAt([
      [ZL.linked ? "● Linked to Zenko" + (ZL.version ? " (" + ZL.version.replace(/^v[\d.]+-/, "") + ")" : "") : "○ Zenko isn't open right now", "fox", null, "", true],
      ...(dl.length ? ["-", ...dl.map((x) => ["  " + x.title + " · " + day(x.date), "clock", () => send({ c: "new" })])] : []),
      "-",
      ["Summarize this page", "note", () => send({ c: "page", a: "sumPage" }), "", !web],
      ["Quiz me on this page", "book", () => send({ c: "page", a: "quizPage" }), "", !web],
      ["Send page to Zenko notes", "save", () => send({ c: "page", a: "pageNote" }), "", !web],
      ["Clip part of the page to Zenko", "clip", () => setTimeout(() => window.zb.clip(), 260), keys.clip, !web],
      "-",
      ["Zenko's calendar (new tab)", "clock", () => send({ c: "new" })],
    ], r.left, r.bottom + 4);
  }
  // a quick offline summary (when Zenko isn't open): the sentences that carry the page's most used words
  const STOP = new Set("the a an and or but if of to in on at by for with from as is are was were be been being it its this that these those which who whom what when where why how not no so than then there their they them he she his her we our you your i me my can could will would should may might must do does did have has had also into about over after before more most such only other some any each very just".split(" "));
  function summarise(text, n) {
    const clean = String(text).replace(/\s+/g, " ");
    const sents = (clean.match(/[^.!?]+[.!?]+(\s|$)/g) || []).map((x) => x.trim()).filter((x) => x.length > 40 && x.length < 400 && x.split(" ").length > 6);
    if (!sents.length) return [];
    const freq = {};
    clean.toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'-]{2,}/g)?.forEach((w) => { if (!STOP.has(w)) freq[w] = (freq[w] || 0) + 1; });
    const score = sents.map((s, i) => {
      const ws = s.toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'-]{2,}/g) || [];
      const sc = ws.reduce((a, w) => a + (freq[w] || 0), 0) / Math.max(6, ws.length);
      return { s, i, sc: sc * (i < 3 ? 1.25 : 1) };
    });
    const seen = new Set();
    return score.sort((a, b) => b.sc - a.sc).filter((x) => { const k = x.s.slice(0, 40); if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, n).sort((a, b) => a.i - b.i).map((x) => x.s);
  }
  function zkCard(html, buttons) {
    const c = $("#zcard");
    c.innerHTML = html;
    const row = document.createElement("div"); row.className = "row";
    (buttons || []).concat([["Close", () => {}]]).forEach(([label, fn], k) => {
      const b = document.createElement("button"); b.className = "btn" + (k === 0 ? " on" : ""); b.textContent = label;
      b.onclick = () => { closePal(); setTimeout(fn, 40); };
      row.appendChild(b);
    });
    c.appendChild(row);
    ovKind = "card";
    const ov = $("#ov");
    ov.classList.remove("menu");
    ov.classList.add("card");
    if (palOpen) { ov.classList.add("show"); return; }
    palOpen = true; shownSent = false;
    clearShots();
    ov.classList.add("open");
    send({ c: "overlay", on: true });
    clearTimeout(shotTimer);
    shotTimer = setTimeout(shown, 450);
  }
  function zkSummary(d) {
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const pts = summarise(d.text || "", 6);
    if (!pts.length) { note("I couldn't find sentences to summarise here", 4000); return; }
    const words = String(d.text || "").split(/\s+/).length;
    const plain = "Summary: " + (d.title || "") + "\n" + pts.map((x) => "• " + x).join("\n") + (d.url ? "\n(" + d.url + ")" : "");
    zkCard(`<h3>${ZB.icon("fox", 2)} Key points</h3><div class="sub">${esc(d.title || "")}</div><ul>${pts.map((x) => "<li>" + esc(x) + "</li>").join("")}</ul>` +
      `<div class="foot">A quick summary made on this PC from ${words.toLocaleString()} words.${ZL.installed ? " Open Zenko for a smarter one." : ""}</div>`,
      [["Copy", () => { copyText(plain); note("Summary copied", 2200); }]].concat(ZL.installed ? [["Send to Zenko notes", () => send({ c: "toZenko", item: { kind: "note", title: "Summary: " + (d.title || ""), text: plain, url: d.url } })]] : []));
  }
  function zkAddTo(text) {
    const when = parseWhen(text);
    const short = text.length > 50 ? text.slice(0, 47) + "..." : text;
    const t = activeTab() || {};
    if (!when) {
      note("No date in “" + short + "”. Send it to Zenko's notes instead?", 0, [["Send to notes", () => send({ c: "toZenko", item: { kind: "note", text, title: t.title, url: t.url } })], ["Cancel", () => {}]]);
      return;
    }
    const iso = when.getFullYear() + "-" + String(when.getMonth() + 1).padStart(2, "0") + "-" + String(when.getDate()).padStart(2, "0");
    const hasTime = /\d{1,2}(:\d{2})?\s*(am|pm)|\b\d{1,2}:\d{2}\b/i.test(text);
    const tm = hasTime ? String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0") : "";
    const nice = when.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + (tm ? " " + tm : "");
    note("“" + short + "” on " + nice + ". Add to Zenko as:", 0, [
      ["Upcoming deadline", () => send({ c: "toZenko", item: { kind: "deadline", text, date: iso, time: tm, title: t.title, url: t.url } })],
      ["Ema reminder", () => send({ c: "toZenko", item: { kind: "reminder", text, when: Math.round(when / 1000), title: t.title, url: t.url } })],
      ["Cancel", () => {}]]);
  }

  // ---------------------------------------------------------------- API used by Rust
  window.zb = {
    state(s) {
      S = s;
      for (const t of S.tabs) if (/^https?:/.test(t.url) && !t.loading && !Hseen.has(t.url)) { Hseen.add(t.url); H.push({ u: t.url, t: t.title, s: 1 }); }
      renderTabs(); renderTools(); door(); if (palOpen && ovKind === "pal") build();
      if (!routineDone && booted) routine(); },
    openDoor(id) {
      const d = $("#door");
      if (id !== S.active || !d.classList.contains("on")) { send({ c: "revealed", id }); return; }
      d.classList.add("open");
      setTimeout(() => send({ c: "revealed", id }), 780);
      setTimeout(() => { if (!(activeTab() || {}).door) d.classList.remove("on", "open"); }, 1100);
    },
    key(k) { for (const a in keys) if (keys[a] === k && ACT[a]) { ACT[a](); return; } },
    shot(k, data) { window.zbShot(k, data); },
    shotsDone() {
      const imgs = Array.from(document.querySelectorAll("#ov .shot")).filter((i) => i.getAttribute("src"));
      if (!imgs.length) return shown();
      let left = imgs.length;
      imgs.forEach((i) => { if (i.complete) { if (--left === 0) shown(); } else i.onload = i.onerror = () => { if (--left === 0) shown(); }; });
    },
    update(v) {
      if (v.state === "ready") note("Updated to " + v.version, 0, ["Restart", () => send({ c: "restart" })]);
      else if (v.state === "none") note("You have the newest version", 3000);
      else if (v.state === "error") note("Could not check for updates", 4000);
    },
    maximized(m) { S.max = m; renderTools(); },
    focusAddress() { openPal("here", ""); },
    toast(m) { note(m, 3500); },
    link(d) {
      ZL = d || {};
      const b = $("#b-zenko");
      b.classList.toggle("none", !ZL.installed);
      b.classList.toggle("linked", !!ZL.linked);
      const n = (ZL.deadlines || []).length;
      b.title = ZL.linked ? "Linked to Zenko" + (n ? " · " + n + " coming up" : "") : "Zenko isn't open right now";
    },
    summary(d) { zkSummary(d || {}); },
    addTo(text) { zkAddTo(String(text || "")); },
    search(text) { const u = ZB.toUrl(String(text || ""), prefs); if (u) send({ c: "new", url: u }); },
    words(text) {
      const t = String(text || "").trim(), w = t ? t.split(/\s+/).length : 0;
      note(w.toLocaleString() + " words · " + t.length.toLocaleString() + " characters · about " + Math.max(1, Math.round(w / 230)) + " min to read", 6000);
    },
    copy(t, label) { copyText(t); note(label || "Copied", 2200); },
    remind(text) {
      const when = parseWhen(text);
      const short = text.length > 60 ? text.slice(0, 57) + "..." : text;
      if (!when) { note("No date found in that text. Try selecting something like “Due Fri 28 Nov”.", 5000); return; }
      const t = activeTab() || {};
      note("Remind: “" + short + "” on " + when.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + "?", 0,
        [["Add to Zenko", () => send({ c: "toZenko", item: { kind: "reminder", text, when: Math.round(when / 1000), title: t.title, url: t.url } })], ["Cancel", () => {}]]);
    },
    cite(m) {
      const c = cites(m);
      note("Citation ready", 0, [["Copy MLA", () => { copyText(c.mla); note("MLA citation copied", 2500); }], ["Copy APA", () => { copyText(c.apa); note("APA citation copied", 2500); }], ["Close", () => {}]]);
    },
    mail() { if (prefs.outlookSound) { chime(); note("New mail in Outlook", 5000); } },
    clip() { clipStart(); },
    saved(l) { SAVED = Array.isArray(l) ? l : []; },
    archivedList(l) { ARCH = Array.isArray(l) ? l : []; if (palOpen) build(); },
    downloads(l) {
      const was = new Set(DL.filter((d) => d.done).map((d) => d.path + d.at));
      DL = Array.isArray(l) ? l : [];
      DL.filter((d) => d.done && d.ok && !was.has(d.path + d.at)).forEach((d) => {
        const folder = (d.path.match(/[\/]Zenko[\/]([^\/]+)[\/][^\/]+$/) || [])[1];
        note("Downloaded " + d.name + (folder ? " into Zenko\\" + folder : ""), 6000, [["Open", () => send({ c: "openPath", p: d.path })], ["Show", () => send({ c: "showPath", p: d.path })]]);
      });
      if (S.panelMode === "downloads") renderPanel();
    },
    found(qq, l) { found = { q: qq.toLowerCase(), list: l || [], t: 0 }; if (palOpen) { const keep = sel; build(); sel = Math.min(keep, items.length - 1); mark(); } },
    recap(l) { RECAP = l || []; if (S.panelMode === "recap") { pkey = ""; renderPanel(); } },
    keys() { send({ c: "keys", list: Object.values(keys).filter(Boolean) }); },
    history(list) { H = Array.isArray(list) ? list : []; H.forEach((e) => Hseen.add(e.u)); rankHosts(); },
    bookmarks(list) { BM = Array.isArray(list) ? list : []; rankHosts(); },
    imported(r) {
      if (!r || r.state === "noedge") return;
      const what = (r.copied || []).join(", ");
      if (r.state === "locked") {
        note("Edge was open, so your sign-ins could not be copied.", 30000, ["Close Edge and import", () => send({ c: "importEdge", close: true })]);
      } else if (r.appbound) {
        note("Imported from Edge: " + what + ". Edge locks its sign-ins to itself, so some sites will ask you to sign in once.", 14000);
      } else if (what) {
        note("Imported from Edge: " + what + ". You should still be signed in.", 9000);
      }
    },
  };
  window.addEventListener("storage", (e) => { if (e.key === "zb.prefs") applyPrefs(); });

  icons();
  applyPrefs();
  ZB.starfield && ZB.starfield($("#stars"));

  send({ c: "ready" });
  setTimeout(() => { if (!routineDone) routine(); }, 2500);
})();
</script>
