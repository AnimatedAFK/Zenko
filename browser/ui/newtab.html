<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="theme.css">
<script src="prefs.js"></script>
<style>
  body { overflow: hidden; min-height: 100vh; background: var(--night); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  main { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10vh 1rem 0; }
  .clock { font-family: "DotGothic16", var(--font); font-size: 6rem; line-height: 1; letter-spacing: .04em; color: var(--ink);
    text-shadow: 4px 4px 0 color-mix(in srgb, var(--night) 70%, #000), 0 0 30px color-mix(in srgb, var(--glow) 30%, transparent); }
  .clock .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .clock small { font-size: 1.8rem; color: var(--gold); margin-left: .5rem; }
  .jp { font-family: "DotGothic16", var(--font); color: var(--gold); letter-spacing: .18em; margin-top: .7rem; font-size: 1.05rem; }
  .hello { margin-top: .35rem; color: var(--grey); font-size: 1.1rem; }
  form { margin-top: 2.2rem; width: min(42rem, 100%); }
  .search { display: flex; align-items: center; gap: .8rem; height: 3.5rem; padding: 0 1.2rem; color: var(--gold);
    --b: color-mix(in srgb, var(--line) 50%, var(--gold) 50%); --c: color-mix(in srgb, var(--panel) 94%, transparent); }
  .search:focus-within { --b: var(--gold); }
  .search::after { content: ""; position: absolute; inset: 2px; pointer-events: none; background: linear-gradient(100deg, transparent 40%, color-mix(in srgb, var(--gold) 12%, transparent) 50%, transparent 60%);
    background-size: 250% 100%; animation: sweep 6s steps(40) infinite; }
  @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .search input { flex: 1; height: 100%; background: none; border: 0; outline: 0; font-size: 1.2rem; min-width: 0; caret-color: var(--gold); }
  .search input::placeholder { color: var(--grey); }
  .calc { height: 1.7rem; margin-top: .5rem; text-align: center; color: var(--gold); font-size: 1.15rem; font-family: "DotGothic16", var(--font); }
  .sites { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; margin-top: 1.3rem; max-width: 48rem; }
  .site { width: 6.8rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: .95rem .4rem .75rem; color: var(--ink); text-decoration: none;
    --b: color-mix(in srgb, var(--line) 80%, var(--gold) 20%); --c: color-mix(in srgb, var(--panel) 85%, transparent); transition: transform .2s steps(3); }
  .site:hover { transform: translateY(-4px); --b: var(--gold); }
  .site:hover i { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--glow) 70%, transparent)); }
  .site i { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 1.2rem; background: var(--accbg); color: var(--acc); overflow: hidden; clip-path: var(--clips); }
  .site i img { width: 22px; height: 22px; }
  .site span { font-size: .95rem; color: var(--grey); }
  .site:hover span { color: var(--ink); }
  .quote { margin: 2.2rem 0 0; max-width: 36rem; text-align: center; color: var(--grey); line-height: 1.5; padding: .7rem 1.2rem; --b: color-mix(in srgb, var(--line) 60%, transparent); --c: color-mix(in srgb, var(--night) 55%, transparent); }
  .quote::before { content: "✦ "; color: var(--gold); }
  .fox { position: fixed; right: max(4vw, 1rem); bottom: 4vh; width: 116px; z-index: 1; image-rendering: pixelated; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--glow) 35%, transparent)); cursor: pointer; transition: transform .25s steps(4); }
  .fox:hover { transform: translateY(-4px); }
  .bubble { position: fixed; right: calc(max(4vw, 1rem) + 104px); bottom: calc(4vh + 84px); z-index: 2; max-width: 16rem; padding: .65rem .9rem; color: var(--ink); font-size: .98rem;
    --b: var(--gold); --c: var(--panel); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s steps(3); }
  .bubble.on { opacity: 1; transform: none; }
  .gear { position: fixed; right: 1rem; top: 1rem; z-index: 2; clip-path: var(--clips); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="jp" id="jp"></div>
  <div class="hello" id="hello"></div>
  <form id="f" autocomplete="off">
    <label class="search pxb"><span id="si"></span><input id="q" autofocus placeholder="Search the web or type an address" spellcheck="false"></label>
    <div class="calc" id="calc"></div>
  </form>
  <div class="sites" id="sites"></div>
  <p class="quote pxb" id="quote"></p>
</main>
<img class="fox" id="fox" src="zenko.png" alt="Zenko">
<div class="bubble pxb" id="bub"></div>
<a class="btn gear" href="settings.html" title="Settings and look" id="gear"></a>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const p = ZB.load();
  ZB.apply(p);
  ZB.sky($("#sky"), { moon: [0.82, 0.14, 9], ridge: 0.3, torii: 0.2, wisps: 9, S: 3 });
  $("#si").innerHTML = ZB.icon("search", 2.6);
  $("#gear").innerHTML = ZB.icon("gear", 2);

  const JP_H = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
  function tick() {
    const d = new Date();
    const h = d.getHours(), m = d.getMinutes(), h12 = h % 12 || 12;
    $("#clock").innerHTML = `${h12}<span class="colon">:</span>${String(m).padStart(2, "0")}<small>${h < 12 ? "AM" : "PM"}</small>`;
    $("#jp").textContent = (h < 12 ? "午前 " : "午後 ") + JP_H[h12] + "時 · " + d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    $("#hello").textContent = h < 5 ? "Still up? Kon... rest soon" : h < 12 ? "Ohayou! Good morning" : h < 17 ? "Konnichiwa! Good afternoon" : h < 22 ? "Konbanwa! Good evening" : "Late night? Sleep saves what you studied";
  }
  tick(); setInterval(tick, 1000 * 10);

  const sites = $("#sites");
  ZB.sites(p).forEach(([name, url, l]) => {
    const a = document.createElement("a");
    a.className = "site pxb"; a.href = url;
    a.innerHTML = `<i>${l}</i><span></span>`;
    a.querySelector("span").textContent = name;
    const img = new Image();
    img.onload = () => { const i = a.querySelector("i"); i.textContent = ""; i.appendChild(img); };
    img.src = "https://" + new URL(url).hostname + "/favicon.ico";
    sites.appendChild(a);
  });

  const Q = ["Small steps every day add up to big results.", "Rest is part of the work. Your brain files what you learned while you sleep.",
    "You don't have to be perfect, just a little better than yesterday.", "First do it, then do it right, then do it better.",
    "Focus on the next 25 minutes. That's all.", "The expert in anything was once a beginner.", "Done is better than perfect.",
    "Kon kon~ Inari believes in your harvest. Plant some study today!"];
  $("#quote").textContent = Q[new Date().getDate() % Q.length];

  const q = $("#q");
  q.addEventListener("input", () => { const v = ZB.calc(q.value); $("#calc").textContent = v === null ? "" : "= " + v.toLocaleString("en", { maximumFractionDigits: 10 }); });
  $("#f").addEventListener("submit", (e) => { e.preventDefault(); const u = ZB.toUrl(q.value, p); if (u) location.href = u; });
  setTimeout(() => q.focus(), 50);

  const LINES = ["Kon kon! What are we studying today?", "Ne~ one tab at a time, okay?", "I'll log your study time for you!", "Stuck? Ctrl+J opens Claude~", "Ctrl+K finds anything: tabs, sites, commands!"];
  let n = 0;
  $("#fox").addEventListener("click", () => {
    const b = $("#bub"); b.textContent = LINES[n++ % LINES.length]; b.classList.add("on");
    clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("on"), 3500);
  });
  window.addEventListener("storage", (e) => { if (e.key === "zb.prefs") location.reload(); });
})();
</script>
</body>
</html>
