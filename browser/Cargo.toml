[package]
name = "zenko-browser"
version = "0.1.0"
edition = "2021"
description = "Zenko Browser - a fast night-shrine browser that talks to Zenko"
build = "build.rs"

[[bin]]
name = "ZenkoBrowser"
path = "src/main.rs"

[dependencies]
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
] }
windows-core = "0.62"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
