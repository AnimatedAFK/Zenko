[package]
name = "zenko-desktop"
version = "0.1.0"
edition = "2024"
description = "Zenko on the desktop (Rust port of FoxBuddy's desktop fox)"

[[bin]]
name = "ZenkoRust"
path = "src/main.rs"

[dependencies]
zenko-art = { path = "../zenko-art" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = "1"
regex = "1"
unicode-normalization = "0.1"
zenko-sound = { path = "../zenko-sound" }
fancy-regex = "0.14"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
miniz_oxide = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_System_Time", "Win32_Media_Audio", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_Registry", "Win32_Globalization", "Win32_Security", "Win32_Media", "Win32_Graphics_Dwm",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_Media_Multimedia", "Win32_Networking_WinHttp", "Win32_System_Power",
  "Win32_UI_Shell", "Win32_UI_Shell_Common",
] }

[dev-dependencies]
gif = "0.13"
