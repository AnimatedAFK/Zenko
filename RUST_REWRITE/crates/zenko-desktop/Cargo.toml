[package]
name = "zenko-desktop"
version = "0.1.0"
edition = "2024"
description = "Zenko on the desktop (Rust port of FoxBuddy's desktop fox)"

[[bin]]
name = "ZenkoRust"
path = "src/main.rs"

[dependencies]
zenko-art = { path = "../zenko-art" }
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
zenko-sound = { path = "../zenko-sound" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_System_Time", "Win32_Media_Audio", "Win32_UI_Controls", "Win32_Media",
] }

[dev-dependencies]
gif = "0.13"
